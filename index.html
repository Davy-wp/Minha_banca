<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Banca Betano Pro - Com Edição de Bilhetes</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #202024;
      --border: #29292e;
      --text: #e1e1e6;
      --subtext: #a8a8b3;
      --green: #00875f;
      --green-text: #00b37e;
      --red: #f75a68;
      --yellow: #e1a100;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 15px;
      margin: 0;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
    }

    h2 { text-align: center; margin-top: 5px; margin-bottom: 15px; font-size: 1.3rem; color: #fff; }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .card h4 { margin: 0; font-size: 0.7rem; color: var(--subtext); text-transform: uppercase; }
    .card p { margin: 6px 0 0; font-size: 1.1rem; font-weight: bold; }

    .bank-setup {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bank-row { display: flex; gap: 8px; align-items: center; }
    .bank-row label { font-size: 0.85rem; color: var(--subtext); min-width: 90px; }

    form {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, select, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      background: #121214;
      color: #fff;
      box-sizing: border-box;
      width: 100%;
    }

    input:focus, select:focus { outline: 1px solid var(--green); }

    .add-selection-box {
      background: #18181b;
      padding: 12px;
      border-radius: 6px;
      border: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .match-inputs {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .match-inputs input { flex: 1; }
    .match-vs { font-weight: bold; color: var(--subtext); font-size: 0.85rem; }

    .category-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-sec-add { background: #29292e; color: #fff; font-size: 0.85rem; font-weight: bold; cursor: pointer; border: 1px solid var(--border); }
    .btn-add { background: var(--green); color: #fff; font-weight: bold; border: none; cursor: pointer; padding: 12px; }

    .selections-builder {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .builder-item {
      background: var(--card-bg);
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
    }

    .builder-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .builder-item-match { font-weight: bold; color: var(--green-text); font-size: 0.8rem; }

    .filters {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      overflow-x: auto;
    }

    .btn-filter {
      background: var(--card-bg);
      color: var(--subtext);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-filter.active { background: var(--green); color: #fff; border-color: var(--green); }

    .bet-item {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .bet-date { font-size: 0.75rem; color: var(--subtext); font-weight: bold; }
    .bet-title { font-size: 1.05rem; font-weight: bold; color: #fff; margin-top: 2px; }
    .bet-financial { font-size: 0.85rem; color: var(--subtext); text-align: right; }

    .legs-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .leg-item {
      background: #18181b;
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border-left: 3px solid var(--border);
    }

    .leg-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .leg-match-title { font-size: 0.75rem; color: var(--subtext); font-weight: bold; }

    .leg-item.green { border-left-color: var(--green-text); }
    .leg-item.red { border-left-color: var(--red); }
    .leg-item.pending { border-left-color: var(--yellow); }

    .leg-actions { display: flex; gap: 4px; }
    .btn-mini-green { background: var(--green); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .btn-mini-red { background: var(--red); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }

    .batch-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }

    .btn-batch-green {
      background: rgba(0, 180, 126, 0.2);
      color: var(--green-text);
      border: 1px solid var(--green);
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
      flex: 1;
    }

    .btn-batch-red {
      background: rgba(247, 90, 104, 0.2);
      color: var(--red);
      border: 1px solid var(--red);
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
      flex: 1;
    }

    .bet-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 5px;
    }

    .footer-buttons { display: flex; gap: 6px; }

    .status-badge { font-size: 0.85rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; }
    .badge-green { background: rgba(0, 180, 126, 0.15); color: var(--green-text); }
    .badge-red { background: rgba(247, 90, 104, 0.15); color: var(--red); }
    .badge-pending { background: rgba(225, 161, 0, 0.15); color: var(--yellow); }

    .btn-edit { background: #29292e; color: #fff; border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .btn-del { background: #29292e; color: #a8a8b3; border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .green-text { color: var(--green-text); font-weight: bold; }
    .red-text { color: var(--red); font-weight: bold; }

    .backup-actions { display: flex; gap: 8px; margin-top: 5px; }
    .btn-sec { background: #29292e; color: #fff; border: none; padding: 8px; font-size: 0.8rem; cursor: pointer; }

    /* Estilos da Janela Modal de Edição */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 15px;
      box-sizing: border-box;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body>

  <h2>📊 Gestor de Banca Betano Pro</h2>

  <div class="dashboard">
    <div class="card"><h4>BANCA ATUAL</h4><p id="currentBank">R$ 0.00</p></div>
    <div class="card"><h4>LUCRO LÍQUIDO</h4><p id="totalProfit">R$ 0.00</p></div>
    <div class="card"><h4>TAXA DE ACERTO</h4><p id="winRate">0%</p></div>
    <div class="card"><h4>YIELD (RETORNO)</h4><p id="yield">0%</p></div>
  </div>

  <div class="bank-setup">
    <div class="bank-row">
      <label for="initialBankInput">Banca Inicial:</label>
      <input type="number" id="initialBankInput" step="0.01" placeholder="Ex: 100.00" onchange="updateInitialBank(this.value)">
    </div>
    <div class="backup-actions">
      <button class="btn-sec" onclick="exportData()">💾 Backup</button>
      <button class="btn-sec" onclick="importData()">📂 Restauração</button>
      <button class="btn-sec" style="color: var(--red);" onclick="resetAll()">⚠️ Zerar Tudo</button>
    </div>
  </div>

  <datalist id="teamsList">
    <option value="Al-Hilal"><option value="Al-Ahly"><option value="Al-Nassr"><option value="Al-Ittihad">
    <option value="Flamengo"><option value="Palmeiras"><option value="São Paulo"><option value="Corinthians">
    <option value="Fluminense"><option value="Botafogo"><option value="Grêmio"><option value="Internacional">
    <option value="Atlético-MG"><option value="Cruzeiro"><option value="Sport Recife"><option value="Ceará">
    <option value="Real Madrid"><option value="Barcelona"><option value="Manchester City"><option value="Bayern de Munique">
    <option value="PSG"><option value="Boca Juniors"><option value="River Plate"><option value="Liverpool">
    <option value="Arsenal"><option value="Chelsea"><option value="Juventus"><option value="Inter de Milão">
  </datalist>

  <form id="betForm">
    <input type="date" id="betDate" required>

    <div class="add-selection-box">
      <span style="font-size: 0.85rem; color: var(--subtext); font-weight: bold;">Adicionar Jogos e Mercados ao Bilhete:</span>
      
      <div class="match-inputs">
        <input type="text" id="legHomeTeam" list="teamsList" placeholder="Mandante (Ex: Al-Hilal)" autocomplete="off">
        <span class="match-vs">x</span>
        <input type="text" id="legAwayTeam" list="teamsList" placeholder="Visitante (Ex: Al-Ahly)" autocomplete="off">
      </div>

      <div class="category-grid">
        <select id="marketCategory" onchange="updateMarketOptions()">
          <option value="">-- Categoria Betano --</option>
          <option value="escanteios">🚩 Escanteios (Todos de 0.5 a 18.5)</option>
          <option value="gols">⚽ Gols & Ambas Marcam (0.5 a 10.5)</option>
          <option value="cartoes">🟨 Cartões (0.5 a 12.5)</option>
          <option value="chutes_gol">🎯 Chutes no Gol (0.5 a 15.5)</option>
          <option value="finalizacoes">🚀 Finalizações Totais (0.5 a 25.5)</option>
          <option value="faltas">⚠️ Faltas (5.5 a 35.5)</option>
          <option value="impedimentos">🚩 Impedimentos (0.5 a 10.5)</option>
          <option value="jogador">👤 Mercados de Jogadores</option>
          <option value="resultado">🏆 Resultado & Handicap</option>
        </select>

        <select id="marketSelect">
          <option value="">Selecione a categoria acima...</option>
        </select>
      </div>

      <input type="text" id="customMarketInput" placeholder="Ou digite o mercado manualmente (Ex: Cristiano Ronaldo 1+ Chute)..." autocomplete="off">

      <button type="button" class="btn-sec-add" onclick="addLegToForm()">➕ Adicionar Seleção (Múltipla / Tripla)</button>
      <div id="builderList" class="selections-builder"></div>
    </div>

    <input type="number" step="0.01" id="stake" placeholder="Stake / Valor Apostado (R$)" required>
    <input type="number" step="0.01" id="odds" placeholder="Odd Total do Bilhete (Ex: 3.50)" required>

    <button type="submit" class="btn-add">Cadastrar Bilhete de Aposta</button>
  </form>

  <div class="filters">
    <button class="btn-filter active" onclick="setFilter('all', this)">Todas</button>
    <button class="btn-filter" onclick="setFilter('pending', this)">Pendentes</button>
    <button class="btn-filter" onclick="setFilter('green', this)">Greens 🟢</button>
    <button class="btn-filter" onclick="setFilter('red', this)">Reds 🔴</button>
  </div>

  <div id="betsList"></div>

  <!-- Modal Overlay para Edição de Bilhete -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin:0; font-size:1.1rem;">✏️ Editar Bilhete de Aposta</h3>
      
      <label style="font-size:0.8rem; color:var(--subtext);">Data da Aposta:</label>
      <input type="date" id="editDate">

      <label style="font-size:0.8rem; color:var(--subtext);">Stake (R$):</label>
      <input type="number" step="0.01" id="editStake">

      <label style="font-size:0.8rem; color:var(--subtext);">Odd Total:</label>
      <input type="number" step="0.01" id="editOdds">

      <div style="border-top:1px dashed var(--border); padding-top:10px;">
        <span style="font-size:0.85rem; font-weight:bold; color:var(--subtext);">Seleções do Bilhete:</span>
        <div id="editLegsContainer" style="margin-top:8px;"></div>
        <button type="button" class="btn-sec-add" style="margin-top:6px;" onclick="addLegInEdit()">➕ Adicionar Nova Seleção ao Bilhete</button>
      </div>

      <div style="display:flex; gap:8px; margin-top:10px;">
        <button type="button" class="btn-add" style="flex:1;" onclick="saveEdit()">💾 Salvar Alterações</button>
        <button type="button" class="btn-sec" style="flex:1;" onclick="closeEditModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const daysOfWeek = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];

    function generateRange(prefix, min, max, step = 1, suffix = '') {
      let list = [];
      for (let i = min; i <= max; i += step) {
        let val = (i % 1 === 0) ? i : i.toFixed(1);
        list.push(`${prefix} ${val}${suffix}`);
      }
      return list;
    }

    function buildAllBetanoMarkets() {
      return {
        escanteios: [
          ...generateRange("Escanteios Partida: Mais de", 0.5, 18.5, 1),
          ...generateRange("Escanteios Partida: Menos de", 0.5, 18.5, 1),
          ...generateRange("Escanteios Mandante: Mais de", 0.5, 12.5, 1),
          ...generateRange("Escanteios Visitante: Mais de", 0.5, 12.5, 1),
          ...generateRange("Escanteios 1º Tempo: Mais de", 0.5, 9.5, 1)
        ],
        gols: [
          ...generateRange("Gols Partida: Mais de", 0.5, 10.5, 1),
          ...generateRange("Gols Partida: Menos de", 0.5, 10.5, 1),
          ...generateRange("Gols Mandante: Mais de", 0.5, 6.5, 1),
          ...generateRange("Gols Visitante: Mais de", 0.5, 6.5, 1),
          "Ambos Marcam: Sim", "Ambos Marcam: Não"
        ],
        cartoes: [
          ...generateRange("Cartões Partida: Mais de", 0.5, 12.5, 1),
          ...generateRange("Cartões Mandante: Mais de", 0.5, 6.5, 1),
          ...generateRange("Cartões Visitante: Mais de", 0.5, 6.5, 1)
        ],
        chutes_gol: [
          ...generateRange("Chutes no Gol Partida: Mais de", 0.5, 16.5, 1),
          ...generateRange("Chutes no Gol Mandante: Mais de", 0.5, 10.5, 1),
          ...generateRange("Chutes no Gol Visitante: Mais de", 0.5, 10.5, 1)
        ],
        finalizacoes: [
          ...generateRange("Finalizações Totais Partida: Mais de", 4.5, 28.5, 1)
        ],
        faltas: [
          ...generateRange("Faltas Totais Partida: Mais de", 9.5, 38.5, 1)
        ],
        impedimentos: [
          ...generateRange("Impedimentos Partida: Mais de", 0.5, 10.5, 1)
        ],
        jogador: [
          ...generateRange("Jogador: +", 0.5, 5.5, 1, " Chutes no Gol"),
          ...generateRange("Jogador: +", 0.5, 7.5, 1, " Finalizações Totais"),
          ...generateRange("Jogador: +", 0.5, 3.5, 1, " Gols Marcados")
        ],
        resultado: [
          "Resultado Final: Vitória Mandante (1)", "Resultado Final: Empate (X)", "Resultado Final: Vitória Visitante (2)",
          "Dupla Chance: Mandante ou Empate (1X)", "Dupla Chance: Visitante ou Empate (X2)", "Dupla Chance: Qualquer Time (12)",
          "Empate Anula Aposta (DNB): Mandante", "Empate Anula Aposta (DNB): Visitante"
        ]
      };
    }

    const categoriasBetano = buildAllBetanoMarkets();

    let bets = JSON.parse(localStorage.getItem('myBets')) || [];
    let initialBank = parseFloat(localStorage.getItem('initialBank')) || 0;
    let currentFilter = 'all';
    let tempLegs = [];

    // Controle de Edição
    let editingBetId = null;
    let editLegs = [];

    document.getElementById('betDate').valueAsDate = new Date();
    document.getElementById('initialBankInput').value = initialBank ? initialBank : '';

    function updateMarketOptions() {
      const cat = document.getElementById('marketCategory').value;
      const select = document.getElementById('marketSelect');
      select.innerHTML = '<option value="">-- Selecione o Mercado --</option>';

      if (cat && categoriasBetano[cat]) {
        categoriasBetano[cat].forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          select.appendChild(opt);
        });
      }
    }

    function updateInitialBank(val) {
      initialBank = parseFloat(val) || 0;
      localStorage.setItem('initialBank', initialBank);
      render();
    }

    function addLegToForm() {
      const home = document.getElementById('legHomeTeam').value.trim();
      const away = document.getElementById('legAwayTeam').value.trim();
      const match = (home && away) ? `${home} x ${away}` : (home || away || 'Jogo Genérico');

      const selectVal = document.getElementById('marketSelect').value;
      const customVal = document.getElementById('customMarketInput').value.trim();
      const market = selectVal || customVal;

      if (market) {
        tempLegs.push({
          id: Date.now() + Math.random(),
          match: match,
          name: market,
          status: 'pending'
        });

        document.getElementById('marketSelect').value = '';
        document.getElementById('customMarketInput').value = '';
        renderBuilder();
      }
    }

    function removeLegFromForm(id) {
      tempLegs = tempLegs.filter(l => l.id !== id);
      renderBuilder();
    }

    function renderBuilder() {
      const container = document.getElementById('builderList');
      container.innerHTML = tempLegs.map(l => `
        <div class="builder-item">
          <div class="builder-item-info">
            <span class="builder-item-match">⚽ ${l.match}</span>
            <span>📌 ${l.name}</span>
          </div>
          <button type="button" style="background:none; border:none; color:var(--red); cursor:pointer; font-weight:bold;" onclick="removeLegFromForm(${l.id})">✖</button>
        </div>
      `).join('');
    }

    document.getElementById('betForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const dateVal = document.getElementById('betDate').value;
      const stake = parseFloat(document.getElementById('stake').value);
      const odds = parseFloat(document.getElementById('odds').value);

      if (tempLegs.length === 0) {
        alert("Adicione pelo menos uma seleção/jogo ao bilhete!");
        return;
      }

      let betTypeTitle = "Aposta Simples";
      if (tempLegs.length === 2) betTypeTitle = "Bilhete Duplo (2 Seleções)";
      else if (tempLegs.length === 3) betTypeTitle = "Bilhete Triplo (3 Seleções)";
      else if (tempLegs.length > 3) betTypeTitle = `Múltipla (${tempLegs.length} Seleções)`;
      else if (tempLegs.length === 1) betTypeTitle = tempLegs[0].match;

      bets.unshift({
        id: Date.now(),
        date: dateVal,
        title: betTypeTitle,
        stake,
        odds,
        status: 'pending',
        legs: [...tempLegs]
      });

      tempLegs = [];
      renderBuilder();
      saveAndUpdate();
      e.target.reset();
      document.getElementById('betDate').valueAsDate = new Date();
    });

    // Funções do Modal de Edição
    function openEditModal(id) {
      const bet = bets.find(b => b.id === id);
      if (!bet) return;

      editingBetId = id;
      editLegs = JSON.parse(JSON.stringify(bet.legs || []));

      document.getElementById('editDate').value = bet.date;
      document.getElementById('editStake').value = bet.stake;
      document.getElementById('editOdds').value = bet.odds;

      renderEditLegs();
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      editingBetId = null;
      editLegs = [];
      document.getElementById('editModal').style.display = 'none';
    }

    function renderEditLegs() {
      const container = document.getElementById('editLegsContainer');
      container.innerHTML = editLegs.map((l, idx) => `
        <div style="background:#18181b; padding:8px; border-radius:6px; margin-bottom:8px; display:flex; flex-direction:column; gap:6px; border:1px solid var(--border);">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.75rem; color:var(--subtext); font-weight:bold;">Seleção #${idx + 1}</span>
            <button type="button" style="background:none; border:none; color:var(--red); cursor:pointer; font-weight:bold; font-size:0.75rem;" onclick="removeEditLeg(${idx})">✖ Remover</button>
          </div>
          <input type="text" list="teamsList" value="${l.match}" oninput="editLegs[${idx}].match = this.value" placeholder="Confronto (Ex: Flamengo x Fluminense)">
          <input type="text" value="${l.name}" oninput="editLegs[${idx}].name = this.value" placeholder="Mercado (Ex: Mais de 2.5 Gols)">
        </div>
      `).join('');
    }

    function addLegInEdit() {
      editLegs.push({
        id: Date.now() + Math.random(),
        match: "Novo Jogo x Time",
        name: "Novo Mercado",
        status: "pending"
      });
      renderEditLegs();
    }

    function removeEditLeg(idx) {
      editLegs.splice(idx, 1);
      renderEditLegs();
    }

    function saveEdit() {
      const bet = bets.find(b => b.id === editingBetId);
      if (!bet) return;

      if (editLegs.length === 0) {
        alert("O bilhete precisa ter ao menos uma seleção!");
        return;
      }

      bet.date = document.getElementById('editDate').value;
      bet.stake = parseFloat(document.getElementById('editStake').value) || bet.stake;
      bet.odds = parseFloat(document.getElementById('editOdds').value) || bet.odds;
      bet.legs = editLegs;

      if (bet.legs.length === 1) bet.title = bet.legs[0].match;
      else if (bet.legs.length === 2) bet.title = "Bilhete Duplo (2 Seleções)";
      else if (bet.legs.length === 3) bet.title = "Bilhete Triplo (3 Seleções)";
      else bet.title = `Múltipla (${bet.legs.length} Seleções)`;

      updateBetOverallStatus(bet);
      saveAndUpdate();
      closeEditModal();
    }

    function toggleLegStatus(betId, legId, newStatus) {
      const bet = bets.find(b => b.id === betId);
      if (bet) {
        const leg = bet.legs.find(l => l.id === legId);
        if (leg) {
          leg.status = (leg.status === newStatus) ? 'pending' : newStatus;
        }

        updateBetOverallStatus(bet);
        saveAndUpdate();
      }
    }

    function resolveAllLegs(betId, targetStatus) {
      const bet = bets.find(b => b.id === betId);
      if (bet) {
        bet.legs.forEach(l => l.status = targetStatus);
        bet.status = targetStatus;
        saveAndUpdate();
      }
    }

    function updateBetOverallStatus(bet) {
      const hasRed = bet.legs.some(l => l.status === 'red');
      const allGreen = bet.legs.every(l => l.status === 'green');

      if (hasRed) {
        bet.status = 'red';
      } else if (allGreen && bet.legs.length > 0) {
        bet.status = 'green';
      } else {
        bet.status = 'pending';
      }
    }

    function deleteBet(id) {
      if (confirm("Deseja apagar este bilhete de aposta?")) {
        bets = bets.filter(b => b.id !== id);
        saveAndUpdate();
      }
    }

    function resetAll() {
      if (confirm("⚠️ ATENÇÃO: Deseja apagar TODAS as apostas e zerar a banca?")) {
        bets = [];
        initialBank = 0;
        localStorage.removeItem('myBets');
        localStorage.removeItem('initialBank');
        document.getElementById('initialBankInput').value = '';
        render();
      }
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function saveAndUpdate() {
      localStorage.setItem('myBets', JSON.stringify(bets));
      render();
    }

    function formatDateFormatted(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const dayName = daysOfWeek[d.getDay()];
      return `${dayName}, ${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function render() {
      const list = document.getElementById('betsList');
      list.innerHTML = '';

      let totalProfit = 0;
      let totalStaked = 0;
      let greens = 0;
      let finishedCount = 0;

      bets.forEach(b => {
        let profit = 0;
        if (b.status === 'green') {
          profit = (b.stake * b.odds) - b.stake;
          totalProfit += profit;
          totalStaked += b.stake;
          greens++;
          finishedCount++;
        } else if (b.status === 'red') {
          profit = -b.stake;
          totalProfit += profit;
          totalStaked += b.stake;
          finishedCount++;
        }

        if (currentFilter !== 'all' && b.status !== currentFilter) {
          return;
        }

        const div = document.createElement('div');
        div.className = 'bet-item';

        const legsHtml = (b.legs || []).map(l => `
          <div class="leg-item ${l.status}">
            <div class="leg-details">
              <span class="leg-match-title">⚽ ${l.match}</span>
              <span>${l.status === 'green' ? '✅' : l.status === 'red' ? '❌' : '⏳'} ${l.name}</span>
            </div>
            <div class="leg-actions">
              <button class="btn-mini-green" onclick="toggleLegStatus(${b.id}, ${l.id}, 'green')">🟢</button>
              <button class="btn-mini-red" onclick="toggleLegStatus(${b.id}, ${l.id}, 'red')">🔴</button>
            </div>
          </div>
        `).join('');

        let badgeClass = 'badge-pending';
        let badgeText = 'PENDENTE ⏳';
        if (b.status === 'green') { badgeClass = 'badge-green'; badgeText = 'GREEN 🟢'; }
        if (b.status === 'red') { badgeClass = 'badge-red'; badgeText = 'RED 🔴'; }

        div.innerHTML = `
          <div class="bet-header">
            <div>
              <div class="bet-date">📅 ${formatDateFormatted(b.date)}</div>
              <div class="bet-title">${b.title}</div>
            </div>
            <div class="bet-financial">
              <strong>R$ ${b.stake.toFixed(2)}</strong> @ <strong>${b.odds.toFixed(2)}</strong>
              <div>${b.status !== 'pending' ? `<span class="${profit >= 0 ? 'green-text' : 'red-text'}">${profit > 0 ? '+' : ''}R$ ${profit.toFixed(2)}</span>` : ''}</div>
            </div>
          </div>

          <div class="legs-list">
            ${legsHtml}
          </div>

          <div class="batch-actions">
            <button class="btn-batch-green" onclick="resolveAllLegs(${b.id}, 'green')">🟢 Green All</button>
            <button class="btn-batch-red" onclick="resolveAllLegs(${b.id}, 'red')">🔴 Red All</button>
          </div>

          <div class="bet-footer">
            <span class="status-badge ${badgeClass}">${badgeText}</span>
            <div class="footer-buttons">
              <button class="btn-edit" onclick="openEditModal(${b.id})" title="Editar Bilhete">✏️ Editar</button>
              <button class="btn-del" onclick="deleteBet(${b.id})" title="Excluir Bilhete">🗑️ Excluir</button>
            </div>
          </div>
        `;

        list.appendChild(div);
      });

      const currentBank = initialBank + totalProfit;

      document.getElementById('currentBank').textContent = `R$ ${currentBank.toFixed(2)}`;
      document.getElementById('totalProfit').textContent = `R$ ${totalProfit.toFixed(2)}`;
      document.getElementById('totalProfit').style.color = totalProfit >= 0 ? '#00b37e' : '#f75a68';
      
      document.getElementById('winRate').textContent = finishedCount ? `${((greens / finishedCount) * 100).toFixed(1)}%` : '0%';
      document.getElementById('yield').textContent = totalStaked ? `${((totalProfit / totalStaked) * 100).toFixed(1)}%` : '0%';
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ bets, initialBank }));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", `banca_backup_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchorElem.click();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file, 'UTF-8');
        reader.onload = readerEvent => {
          try {
            const content = JSON.parse(readerEvent.target.result);
            if (content.bets) {
              bets = content.bets;
              initialBank = content.initialBank || 0;
              document.getElementById('initialBankInput').value = initialBank;
              saveAndUpdate();
              alert("Backup restaurado com sucesso!");
            }
          } catch (err) {
            alert("Erro ao ler o arquivo de backup.");
          }
        }
      }
      input.click();
    }

    render();
  </script>
</body>
</html>
