<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Banca Betano</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121214; color: #e1e1e6; padding: 15px; margin: 0; }
    .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .card { background: #202024; padding: 12px; border-radius: 8px; border: 1px solid #29292e; text-align: center; }
    .card h4 { margin: 0; font-size: 0.75rem; color: #a8a8b3; }
    .card p { margin: 6px 0 0; font-size: 1.1rem; font-weight: bold; }
    form { background: #202024; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
    input, button { padding: 10px; border-radius: 6px; border: none; font-size: 0.95rem; }
    input { background: #121214; color: #fff; border: 1px solid #29292e; }
    .btn-add { background: #00875f; color: #fff; font-weight: bold; cursor: pointer; }
    .bet-item { background: #202024; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #29292e; }
    .actions { display: flex; gap: 6px; }
    .btn-green { background: #00875f; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    .btn-red { background: #f75a68; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    .green-text { color: #00b37e; font-weight: bold; }
    .red-text { color: #f75a68; font-weight: bold; }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="card"><h4>LUCRO LÍQUIDO</h4><p id="totalProfit">R$ 0.00</p></div>
    <div class="card"><h4>TOTAL APOSTADO</h4><p id="totalStaked">R$ 0.00</p></div>
    <div class="card"><h4>TAXA DE ACERTO</h4><p id="winRate">0%</p></div>
    <div class="card"><h4>YIELD (RETORNO)</h4><p id="yield">0%</p></div>
  </div>

  <form id="betForm">
    <input type="text" id="match" placeholder="Jogo / Mercado (ex: Al-Hilal)" required>
    <input type="number" step="0.01" id="stake" placeholder="Stake (R$)" required>
    <input type="number" step="0.01" id="odds" placeholder="Odd" required>
    <button type="submit" class="btn-add">Cadastrar Aposta</button>
  </form>

  <div id="betsList"></div>

  <script>
    let bets = JSON.parse(localStorage.getItem('myBets')) || [];

    document.getElementById('betForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const match = document.getElementById('match').value;
      const stake = parseFloat(document.getElementById('stake').value);
      const odds = parseFloat(document.getElementById('odds').value);

      bets.unshift({ id: Date.now(), match, stake, odds, status: 'pending' });
      saveAndUpdate();
      e.target.reset();
    });

    function resolveBet(id, status) {
      const bet = bets.find(b => b.id === id);
      if (bet) {
        bet.status = status;
        saveAndUpdate();
      }
    }

    function saveAndUpdate() {
      localStorage.setItem('myBets', JSON.stringify(bets));
      render();
    }

    function render() {
      const list = document.getElementById('betsList');
      list.innerHTML = '';

      let totalProfit = 0, totalStaked = 0, greens = 0, finishedCount = 0;

      bets.forEach(b => {
        let profit = 0;
        if (b.status === 'green') {
          profit = (b.stake * b.odds) - b.stake;
          totalProfit += profit;
          totalStaked += b.stake;
          greens++;
          finishedCount++;
        } else if (b.status === 'red') {
          profit = -b.stake;
          totalProfit += profit;
          totalStaked += b.stake;
          finishedCount++;
        }

        const div = document.createElement('div');
        div.className = 'bet-item';
        div.innerHTML = `
          <div>
            <strong>${b.match}</strong><br>
            <small>R$ ${b.stake.toFixed(2)} @ ${b.odds.toFixed(2)}</small>
          </div>
          <div class="actions">
            ${b.status === 'pending' ? `
              <button class="btn-green" onclick="resolveBet(${b.id}, 'green')">🟢 Green</button>
              <button class="btn-red" onclick="resolveBet(${b.id}, 'red')">🔴 Red</button>
            ` : `<span class="${b.status === 'green' ? 'green-text' : 'red-text'}">
                ${b.status.toUpperCase()} (${profit > 0 ? '+' : ''}R$ ${profit.toFixed(2)})
               </span>`}
          </div>
        `;
        list.appendChild(div);
      });

      document.getElementById('totalProfit').textContent = `R$ ${totalProfit.toFixed(2)}`;
      document.getElementById('totalStaked').textContent = `R$ ${totalStaked.toFixed(2)}`;
      document.getElementById('winRate').textContent = finishedCount ? `${((greens / finishedCount) * 100).toFixed(1)}%` : '0%';
      document.getElementById('yield').textContent = totalStaked ? `${((totalProfit / totalStaked) * 100).toFixed(1)}%` : '0%';
    }

    render();
  </script>
</body>
</html>
