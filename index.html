<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bet Manager Pro - Black & Green</title>
  <style>
    :root {
      --bg: #090c0a;
      --card-bg: #111713;
      --card-inner: #18221c;
      --border: #233328;
      --border-focus: #00ff66;
      --text: #f0f7f2;
      --subtext: #82a08c;
      --accent: #00ff66; /* Verde Neon Clean */
      --accent-glow: rgba(0, 255, 102, 0.15);
      --green: #00ff66;
      --green-bg: rgba(0, 255, 102, 0.12);
      --red: #ff4d4d;
      --red-bg: rgba(255, 77, 77, 0.12);
      --yellow: #ffc107;
      --yellow-bg: rgba(255, 193, 7, 0.12);
      --blue: #00b0ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 14px 0 20px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
    }

    header h1 span { color: var(--accent); }

    /* Dashboard Metrics */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--border);
    }

    .metric-card.accent::before { background: var(--accent); }
    .metric-card.green::before { background: var(--green); }
    .metric-card.blue::before { background: var(--blue); }

    .metric-card h4 {
      font-size: 0.7rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .metric-card .val {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .metric-card .sub-val {
      font-size: 0.75rem;
      margin-top: 2px;
      font-weight: 600;
    }

    /* Bank Settings Box */
    .bank-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bank-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bank-row label {
      font-size: 0.85rem;
      color: var(--subtext);
      white-space: nowrap;
    }

    .backup-row {
      display: flex;
      gap: 8px;
    }

    /* Form & Inputs */
    form {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .form-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .match-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .match-vs {
      font-weight: 800;
      color: var(--accent);
      font-size: 0.9rem;
    }

    input, select, button {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* Category Market Picker */
    .market-picker {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .picker-label {
      font-size: 0.8rem;
      color: var(--subtext);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cat-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .cat-tab {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      width: auto;
      transition: all 0.2s;
    }

    .cat-tab.active {
      background: var(--accent);
      color: #000;
      font-weight: 800;
      border-color: var(--accent);
    }

    .submarket-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .submarket-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .submarket-btn:hover {
      border-color: var(--accent);
      background: rgba(0, 255, 102, 0.08);
    }

    .custom-input-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .builder-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .builder-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-main {
      background: var(--accent);
      color: #000;
      font-weight: 800;
      border: none;
      cursor: pointer;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .btn-main:hover {
      filter: brightness(1.1);
    }

    .btn-sec {
      background: var(--card-inner);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 8px 10px;
      border-radius: 6px;
    }

    /* Search & Filter Controls */
    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .filters-bar {
      display: flex;
      gap: 6px;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border-color: var(--accent);
    }

    /* Bet List Item */
    .bet-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bet-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .bet-date { font-size: 0.72rem; color: var(--subtext); font-weight: 600; text-transform: uppercase; }
    .bet-match { font-size: 1.05rem; font-weight: 800; color: #fff; margin-top: 2px; }

    .fin-box {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: var(--card-inner);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      align-items: center;
    }

    .fin-item {
      display: flex;
      flex-direction: column;
      font-size: 0.75rem;
    }

    .fin-item label { color: var(--subtext); font-size: 0.65rem; text-transform: uppercase; font-weight: 700; }
    .fin-item span { font-weight: 700; margin-top: 2px; }

    .legs-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .leg-row {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-left: 4px solid var(--subtext);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .leg-row.green { border-left-color: var(--green); }
    .leg-row.red { border-left-color: var(--red); }
    .leg-row.pending { border-left-color: var(--yellow); }

    .leg-btns { display: flex; gap: 4px; }
    .btn-chip {
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .btn-chip.green { background: var(--green); color: #000; }
    .btn-chip.red { background: var(--red); color: #fff; }

    .bet-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .action-btns {
      display: flex;
      gap: 10px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .badge.pending { background: var(--yellow-bg); color: var(--yellow); }
    .badge.green { background: var(--green-bg); color: var(--green); }
    .badge.red { background: var(--red-bg); color: var(--red); }

    .btn-action {
      background: transparent;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-action.edit:hover { color: var(--accent); }
    .btn-action.del:hover { color: var(--red); }
  </style>
</head>
<body>

  <header>
    <h1>BET MANAGER <span>PRO</span></h1>
  </header>

  <!-- Lista Dinâmica de Sugestão de Times -->
  <datalist id="teamsDatalist"></datalist>

  <!-- Dashboard -->
  <div class="metrics-grid">
    <div class="metric-card accent">
      <h4>Banca Atual</h4>
      <div class="val" id="currentBank">R$ 0,00</div>
      <div class="sub-val" id="bankGrowth" style="color: var(--subtext);">0.0% do Inicial</div>
    </div>
    <div class="metric-card green">
      <h4>Lucro Líquido</h4>
      <div class="val" id="netProfit">R$ 0,00</div>
      <div class="sub-val" id="yieldRate" style="color: var(--green);">Yield: 0%</div>
    </div>
    <div class="metric-card blue">
      <h4>Entradas vs Saídas</h4>
      <div class="val" id="cashFlow" style="font-size: 0.95rem;">R$ 0 / R$ 0</div>
      <div class="sub-val" style="color: var(--subtext);">Apostado / Retornado</div>
    </div>
    <div class="metric-card">
      <h4>Taxa de Acerto</h4>
      <div class="val" id="winRate">0%</div>
      <div class="sub-val" id="finishedBetsCount" style="color: var(--subtext);">0 Bilhetes Resolvidos</div>
    </div>
  </div>

  <!-- Configurações de Banca -->
  <div class="bank-box">
    <div class="bank-row">
      <label for="initialBankInput">Banca Inicial (R$):</label>
      <input type="number" id="initialBankInput" step="0.01" placeholder="Ex: 100,00" onchange="updateInitialBank(this.value)">
    </div>
    <div class="backup-row">
      <button class="btn-sec" onclick="exportData()">💾 Backup JSON</button>
      <button class="btn-sec" onclick="importData()">📂 Restaurar</button>
      <button class="btn-sec" style="color: var(--red);" onclick="resetAll()">⚠️ Resetar</button>
    </div>
  </div>

  <!-- Form de Cadastro / Edição -->
  <form id="betForm">
    <div class="form-title">
      <span id="formTitleText">📌 Novo Bilhete de Aposta</span>
      <button type="button" id="cancelEditBtn" class="btn-sec" style="display:none; width:auto; font-size:0.75rem; color:var(--red);" onclick="cancelEdit()">✖ Cancelar Edição</button>
    </div>

    <input type="date" id="betDate" required>

    <div class="match-inputs">
      <input type="text" id="homeTeam" list="teamsDatalist" placeholder="Mandante (Ex: Flamengo)" required autocomplete="off">
      <span class="match-vs">X</span>
      <input type="text" id="awayTeam" list="teamsDatalist" placeholder="Visitante (Ex: Palmeiras)" required autocomplete="off">
    </div>

    <!-- Seletor de Categorias -->
    <div class="market-picker">
      <span class="picker-label">Selecione o Mercado (Clique para Inserir)</span>
      <div class="cat-tabs" id="catTabsContainer"></div>
      <div id="submarketContainer" class="submarket-grid"></div>

      <div class="custom-input-row">
        <input type="text" id="customMarketInput" placeholder="Ou digite uma linha específica..." autocomplete="off">
        <button type="button" class="btn-sec" style="width: auto; white-space: nowrap;" onclick="addCustomLeg()">➕ Add</button>
      </div>
    </div>

    <div id="builderList" class="builder-list"></div>

    <div style="display: flex; gap: 10px;">
      <input type="number" step="0.01" id="stake" placeholder="Stake / Valor (R$)" required>
      <input type="number" step="0.01" id="odds" placeholder="Odd Total (Ex: 1.85)" required>
    </div>

    <button type="submit" id="formSubmitBtn" class="btn-main">Cadastrar Bilhete de Aposta</button>
  </form>

  <!-- Filtros e Busca -->
  <div class="controls-bar">
    <input type="text" id="searchTeamInput" class="search-input" placeholder="🔍 Buscar por time na lista de apostas..." oninput="render()">
    <div class="filters-bar">
      <button class="filter-btn active" onclick="setFilter('all', this)">Todas</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">Pendentes</button>
      <button class="filter-btn" onclick="setFilter('green', this)">Greens 🟢</button>
      <button class="filter-btn" onclick="setFilter('red', this)">Reds 🔴</button>
    </div>
  </div>

  <!-- Lista de Apostas -->
  <div id="betsList"></div>

  <script>
    const daysOfWeek = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

    function gerarMercadosCompletos() {
      const cats = {
        "Escanteios": [],
        "Gols": [],
        "Chutes": [],
        "Cartões": [],
        "Faltas & Impedimentos": [],
        "Resultado & Principais": [
          "Resultado Final: Vitória Mandante (1)",
          "Resultado Final: Empate (X)",
          "Resultado Final: Vitória Visitante (2)",
          "Dupla Chance: Mandante ou Empate (1X)",
          "Dupla Chance: Visitante ou Empate (X2)",
          "Dupla Chance: Mandante ou Visitante (12)",
          "Empate Anula Aposta: Mandante",
          "Empate Anula Aposta: Visitante",
          "Ambas as Equipes Marcam: Sim",
          "Ambas as Equipes Marcam: Não"
        ],
        "Jogadores": [
          "Jogador para Marcar a Qualquer Momento",
          "Jogador para Dar Assistência",
          "Jogador para Receber Cartão Amarelo",
          "Jogador para Sofrer 1+ Faltas",
          "Jogador para Sofrer 2+ Faltas",
          "Jogador para Dar 1+ Faltas"
        ]
      };

      for (let i = 0.5; i <= 25.5; i += 1.0) {
        cats["Escanteios"].push(`Mais de ${i.toFixed(1)} Escanteios na Partida`);
        cats["Escanteios"].push(`Menos de ${i.toFixed(1)} Escanteios na Partida`);
      }
      for (let i = 0.5; i <= 15.5; i += 1.0) {
        cats["Escanteios"].push(`Mandante: Mais de ${i.toFixed(1)} Escanteios`);
        cats["Escanteios"].push(`Visitante: Mais de ${i.toFixed(1)} Escanteios`);
      }

      for (let i = 0.5; i <= 10.5; i += 1.0) {
        cats["Gols"].push(`Mais de ${i.toFixed(1)} Gols na Partida`);
        cats["Gols"].push(`Menos de ${i.toFixed(1)} Gols na Partida`);
      }

      for (let i = 0.5; i <= 20.5; i += 1.0) {
        cats["Chutes"].push(`Chutes no Gol: Mais de ${i.toFixed(1)} na Partida`);
      }
      for (let i = 4.5; i <= 35.5; i += 1.0) {
        cats["Chutes"].push(`Chutes Totais: Mais de ${i.toFixed(1)} na Partida`);
      }

      for (let i = 0.5; i <= 12.5; i += 1.0) {
        cats["Cartões"].push(`Cartões: Mais de ${i.toFixed(1)} na Partida`);
      }

      for (let i = 12.5; i <= 38.5; i += 1.0) {
        cats["Faltas & Impedimentos"].push(`Faltas Totais: Mais de ${i.toFixed(1)}`);
      }

      return cats;
    }

    let marketCategories = gerarMercadosCompletos();
    let bets = JSON.parse(localStorage.getItem('myBets')) || [];
    let initialBank = parseFloat(localStorage.getItem('initialBank')) || 0;
    let currentFilter = 'all';
    let currentCategory = '';
    let tempLegs = [];
    let editingBetId = null;

    document.getElementById('betDate').valueAsDate = new Date();
    document.getElementById('initialBankInput').value = initialBank ? initialBank : '';

    function updateTeamDatalist() {
      const datalist = document.getElementById('teamsDatalist');
      const defaultTeams = ['Flamengo', 'Palmeiras', 'São Paulo', 'Corinthians', 'Fluminense', 'Botafogo', 'Vasco', 'Grêmio', 'Internacional', 'Atlético-MG', 'Cruzeiro', 'Santos', 'Bahia', 'Fortaleza', 'Real Madrid', 'Barcelona', 'Manchester City', 'Arsenal', 'Liverpool', 'PSG', 'Bayern de Munique'];
      const userTeams = new Set(defaultTeams);

      bets.forEach(b => {
        const parts = b.match.split(' x ');
        parts.forEach(p => p && userTeams.add(p.trim()));
      });

      datalist.innerHTML = Array.from(userTeams).map(t => `<option value="${t}">`).join('');
    }

    function getCategoryIcon(catName) {
      const name = catName.toLowerCase();
      if (name.includes('escanteio')) return '🚩';
      if (name.includes('gol')) return '⚽';
      if (name.includes('chute')) return '🎯';
      if (name.includes('cartã') || name.includes('cartao')) return '🟨';
      if (name.includes('falta')) return '🚨';
      if (name.includes('resultado')) return '🏆';
      if (name.includes('jogador')) return '👤';
      return '📌';
    }

    function renderCategoryTabs() {
      const container = document.getElementById('catTabsContainer');
      const keys = Object.keys(marketCategories);

      if (keys.length === 0) return;
      if (!currentCategory || !keys.includes(currentCategory)) currentCategory = keys[0];

      container.innerHTML = keys.map(cat => {
        const isActive = cat === currentCategory ? 'active' : '';
        const icon = getCategoryIcon(cat);
        const catEscaped = cat.replace(/'/g, "\\'");
        return `<button type="button" class="cat-tab ${isActive}" onclick="selectCategory('${catEscaped}')">${icon} ${cat}</button>`;
      }).join('');

      renderSubmarkets();
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategoryTabs();
    }

    function renderSubmarkets() {
      const container = document.getElementById('submarketContainer');
      const items = marketCategories[currentCategory] || [];
      
      if (items.length === 0) {
        container.innerHTML = '<div style="grid-column: span 2; font-size:0.8rem; color:var(--subtext); padding:10px;">Nenhuma opção nesta categoria.</div>';
        return;
      }

      container.innerHTML = items.map(item => {
        const itemEscaped = item.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return `<button type="button" class="submarket-btn" onclick="addLegFromPicker('${itemEscaped}')">➕ ${item}</button>`;
      }).join('');
    }

    function addLegFromPicker(marketName) {
      tempLegs.push({ id: Date.now() + Math.random(), name: marketName, status: 'pending' });
      renderBuilder();
    }

    function addCustomLeg() {
      const input = document.getElementById('customMarketInput');
      const val = input.value.trim();
      if (val) {
        tempLegs.push({ id: Date.now() + Math.random(), name: val, status: 'pending' });
        input.value = '';
        renderBuilder();
      }
    }

    function removeLegFromForm(id) {
      tempLegs = tempLegs.filter(l => l.id !== id);
      renderBuilder();
    }

    function renderBuilder() {
      const container = document.getElementById('builderList');
      container.innerHTML = tempLegs.map(l => `
        <div class="builder-item">
          <span>📌 ${l.name}</span>
          <button type="button" style="background:none; border:none; color:var(--red); cursor:pointer; font-weight:bold;" onclick="removeLegFromForm(${l.id})">✖</button>
        </div>
      `).join('');
    }

    function updateInitialBank(val) {
      initialBank = parseFloat(val) || 0;
      localStorage.setItem('initialBank', initialBank);
      render();
    }

    // Formulário Submit (Adicionar / Editar)
    document.getElementById('betForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const dateVal = document.getElementById('betDate').value;
      const home = document.getElementById('homeTeam').value.trim();
      const away = document.getElementById('awayTeam').value.trim();
      const match = (home && away) ? `${home} x ${away}` : (home || away);
      
      const stake = parseFloat(document.getElementById('stake').value);
      const odds = parseFloat(document.getElementById('odds').value);

      if (tempLegs.length === 0) {
        alert("Por favor, selecione ao menos uma opção para o bilhete.");
        return;
      }

      if (editingBetId) {
        const idx = bets.findIndex(b => b.id === editingBetId);
        if (idx !== -1) {
          bets[idx] = {
            ...bets[idx],
            date: dateVal,
            match,
            stake,
            odds,
            legs: tempLegs
          };
        }
        cancelEdit();
      } else {
        bets.unshift({
          id: Date.now(),
          date: dateVal,
          match,
          stake,
          odds,
          status: 'pending',
          legs: tempLegs
        });
        tempLegs = [];
        renderBuilder();
        e.target.reset();
        document.getElementById('betDate').valueAsDate = new Date();
      }

      saveAndUpdate();
    });

    function editBet(id) {
      const bet = bets.find(b => b.id === id);
      if (!bet) return;

      editingBetId = bet.id;
      document.getElementById('betDate').value = bet.date;
      
      const parts = bet.match.split(' x ');
      document.getElementById('homeTeam').value = parts[0] || '';
      document.getElementById('awayTeam').value = parts[1] || '';
      
      document.getElementById('stake').value = bet.stake;
      document.getElementById('odds').value = bet.odds;
      
      tempLegs = JSON.parse(JSON.stringify(bet.legs || []));
      renderBuilder();

      document.getElementById('formTitleText').textContent = "✏️ Editando Bilhete";
      document.getElementById('formSubmitBtn').textContent = "💾 Salvar Alterações";
      document.getElementById('cancelEditBtn').style.display = "block";
      document.getElementById('betForm').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEdit() {
      editingBetId = null;
      tempLegs = [];
      renderBuilder();
      document.getElementById('betForm').reset();
      document.getElementById('betDate').valueAsDate = new Date();
      document.getElementById('formTitleText').textContent = "📌 Novo Bilhete de Aposta";
      document.getElementById('formSubmitBtn').textContent = "Cadastrar Bilhete de Aposta";
      document.getElementById('cancelEditBtn').style.display = "none";
    }

    function toggleLegStatus(betId, legId, newStatus) {
      const bet = bets.find(b => b.id === betId);
      if (bet) {
        const leg = bet.legs.find(l => l.id === legId);
        if (leg) {
          leg.status = (leg.status === newStatus) ? 'pending' : newStatus;
        }

        const hasRed = bet.legs.some(l => l.status === 'red');
        const allGreen = bet.legs.every(l => l.status === 'green');

        if (hasRed) {
          bet.status = 'red';
        } else if (allGreen && bet.legs.length > 0) {
          bet.status = 'green';
        } else {
          bet.status = 'pending';
        }

        saveAndUpdate();
      }
    }

    function deleteBet(id) {
      if (confirm("Deseja apagar este bilhete?")) {
        bets = bets.filter(b => b.id !== id);
        saveAndUpdate();
      }
    }

    function resetAll() {
      if (confirm("⚠️ ATENÇÃO: Apagar todas as apostas?")) {
        bets = [];
        initialBank = 0;
        localStorage.removeItem('myBets');
        localStorage.removeItem('initialBank');
        document.getElementById('initialBankInput').value = '';
        render();
      }
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function saveAndUpdate() {
      localStorage.setItem('myBets', JSON.stringify(bets));
      updateTeamDatalist();
      render();
    }

    function formatDateFormatted(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return `${daysOfWeek[d.getDay()]}, ${parts[2]}/${parts[1]}`;
    }

    function render() {
      const list = document.getElementById('betsList');
      const searchQuery = document.getElementById('searchTeamInput').value.toLowerCase().trim();
      list.innerHTML = '';

      let totalStaked = 0;
      let totalReturned = 0;
      let greens = 0;
      let finishedCount = 0;

      bets.forEach(b => {
        let betReturn = 0;
        if (b.status === 'green') {
          betReturn = b.stake * b.odds;
          totalStaked += b.stake;
          totalReturned += betReturn;
          greens++;
          finishedCount++;
        } else if (b.status === 'red') {
          betReturn = 0;
          totalStaked += b.stake;
          finishedCount++;
        }

        // Filtro por status e busca por time
        if (currentFilter !== 'all' && b.status !== currentFilter) return;
        if (searchQuery && !b.match.toLowerCase().includes(searchQuery)) return;

        const potentialReturn = b.stake * b.odds;
        const potentialProfit = potentialReturn - b.stake;
        const netBetProfit = b.status === 'green' ? potentialProfit : (b.status === 'red' ? -b.stake : 0);

        const div = document.createElement('div');
        div.className = 'bet-card';

        const legsHtml = (b.legs || []).map(l => `
          <div class="leg-row ${l.status}">
            <span>${l.status === 'green' ? '✅' : l.status === 'red' ? '❌' : '⏳'} ${l.name}</span>
            <div class="leg-btns">
              <button class="btn-chip green" onclick="toggleLegStatus(${b.id}, ${l.id}, 'green')">GREEN</button>
              <button class="btn-chip red" onclick="toggleLegStatus(${b.id}, ${l.id}, 'red')">RED</button>
            </div>
          </div>
        `).join('');

        let badgeClass = 'pending';
        let badgeText = 'PENDENTE';
        if (b.status === 'green') { badgeClass = 'green'; badgeText = 'GREEN 🟢'; }
        if (b.status === 'red') { badgeClass = 'red'; badgeText = 'RED 🔴'; }

        div.innerHTML = `
          <div class="bet-head">
            <div>
              <div class="bet-date">📅 ${formatDateFormatted(b.date)}</div>
              <div class="bet-match">${b.match}</div>
            </div>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>

          <div class="fin-box">
            <div class="fin-item">
              <label>Apostado</label>
              <span>R$ ${b.stake.toFixed(2)}</span>
            </div>
            <div class="fin-item">
              <label>Odd</label>
              <span>@ ${b.odds.toFixed(2)}</span>
            </div>
            <div class="fin-item">
              <label>Retorno</label>
              <span style="color:var(--blue)">R$ ${potentialReturn.toFixed(2)}</span>
            </div>
            <div class="fin-item">
              <label>Lucro</label>
              <span style="color: ${b.status === 'green' ? 'var(--green)' : b.status === 'red' ? 'var(--red)' : 'var(--yellow)'}">
                ${b.status === 'pending' ? '+R$ ' + potentialProfit.toFixed(2) : (netBetProfit >= 0 ? '+R$ ' + netBetProfit.toFixed(2) : '-R$ ' + Math.abs(netBetProfit).toFixed(2))}
              </span>
            </div>
          </div>

          <div class="legs-container">
            ${legsHtml}
          </div>

          <div class="bet-foot">
            <span style="font-size:0.75rem; color:var(--subtext);">${(b.legs || []).length} seleção(ões)</span>
            <div class="action-btns">
              <button class="btn-action edit" onclick="editBet(${b.id})">✏️ Editar</button>
              <button class="btn-action del" onclick="deleteBet(${b.id})">🗑️ Apagar</button>
            </div>
          </div>
        `;

        list.appendChild(div);
      });

      const netProfit = totalReturned - totalStaked;
      const currentBank = initialBank + netProfit;
      const bankGrowth = initialBank > 0 ? ((netProfit / initialBank) * 100) : 0;
      const yieldRate = totalStaked > 0 ? ((netProfit / totalStaked) * 100) : 0;

      document.getElementById('currentBank').textContent = `R$ ${currentBank.toFixed(2)}`;
      document.getElementById('bankGrowth').textContent = `${bankGrowth >= 0 ? '+' : ''}${bankGrowth.toFixed(1)}% de crescimento`;
      document.getElementById('bankGrowth').style.color = bankGrowth >= 0 ? 'var(--green)' : 'var(--red)';

      document.getElementById('netProfit').textContent = `${netProfit >= 0 ? '+' : ''}R$ ${netProfit.toFixed(2)}`;
      document.getElementById('netProfit').style.color = netProfit >= 0 ? 'var(--green)' : 'var(--red)';
      
      document.getElementById('yieldRate').textContent = `Yield: ${yieldRate.toFixed(1)}%`;
      document.getElementById('cashFlow').textContent = `R$ ${totalStaked.toFixed(2)} / R$ ${totalReturned.toFixed(2)}`;
      
      document.getElementById('winRate').textContent = finishedCount ? `${((greens / finishedCount) * 100).toFixed(1)}%` : '0%';
      document.getElementById('finishedBetsCount').textContent = `${finishedCount} de ${bets.length} bilhetes fechados`;
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ bets, initialBank }));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", `banca_pro_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchorElem.click();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file, 'UTF-8');
        reader.onload = readerEvent => {
          try {
            const content = JSON.parse(readerEvent.target.result);
            if (content.bets) {
              bets = content.bets;
              initialBank = content.initialBank || 0;
              document.getElementById('initialBankInput').value = initialBank;
              saveAndUpdate();
            }
          } catch (err) {
            alert("Erro ao ler arquivo de backup.");
          }
        }
      }
      input.click();
    }

    document.addEventListener('DOMContentLoaded', () => {
      marketCategories = gerarMercadosCompletos();
      updateTeamDatalist();
      renderCategoryTabs();
      render();
    });
  </script>
</body>
</html>
