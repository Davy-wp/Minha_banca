<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bet Manager Pro - Dark Clean</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --card-inner: #262626;
      --border: #333333;
      --text: #f0f0f0;
      --subtext: #a0a0a0;
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.15);
      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.15);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.15);
      --yellow: #f59e0b;
      --yellow-bg: rgba(245, 158, 11, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 720px;
      margin: 0 auto;
    }

    header { text-align: center; padding: 16px 0 20px; }
    header h1 { font-size: 1.4rem; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
    header h1 span { color: var(--green); }

    /* Metrics Dashboard */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .metric-card h4 {
      font-size: 0.7rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .metric-card .val { font-size: 1.2rem; font-weight: 700; }
    .metric-card .sub-val { font-size: 0.75rem; margin-top: 2px; font-weight: 500; }

    /* Banca */
    .bank-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bank-row { display: flex; align-items: center; gap: 10px; }
    .bank-row label { font-size: 0.85rem; color: var(--subtext); white-space: nowrap; }
    .backup-row { display: flex; gap: 8px; }

    /* Formulario */
    form {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--green);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .match-inputs { display: flex; align-items: center; gap: 8px; }
    .match-vs { font-weight: 700; color: var(--blue); font-size: 0.85rem; }

    input, select, button {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus { border-color: var(--green); }

    /* Seletor de Mercado */
    .market-selector-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .selector-title { font-size: 0.75rem; color: var(--subtext); font-weight: 700; text-transform: uppercase; }
    .selector-row { display: flex; gap: 8px; }
    .builder-list { display: flex; flex-direction: column; gap: 6px; }

    .builder-item {
      background: var(--card-inner);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Botoes */
    .btn-main {
      background: var(--green);
      color: #000;
      font-weight: 700;
      border: none;
      cursor: pointer;
      padding: 11px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .btn-sec {
      background: var(--card-inner);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 8px 10px;
      border-radius: 6px;
    }

    .btn-blue { background: var(--blue); color: #fff; font-weight: 600; border: none; }

    /* Filtros e Busca */
    .controls-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .filters-bar { display: flex; gap: 6px; }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--green);
      color: #000;
      font-weight: 700;
      border-color: var(--green);
    }

    /* Cards de Aposta */
    .bet-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bet-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .bet-date { font-size: 0.72rem; color: var(--subtext); font-weight: 600; }
    .bet-match { font-size: 1rem; font-weight: 700; color: #fff; margin-top: 2px; }

    .fin-box {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: var(--card-inner);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .fin-item { display: flex; flex-direction: column; font-size: 0.75rem; }
    .fin-item label { color: var(--subtext); font-size: 0.65rem; text-transform: uppercase; }
    .fin-item span { font-weight: 700; margin-top: 2px; }

    .legs-container { display: flex; flex-direction: column; gap: 6px; }

    .leg-row {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-left: 3px solid var(--subtext);
      padding: 6px 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }

    .leg-row.green { border-left-color: var(--green); }
    .leg-row.red { border-left-color: var(--red); }
    .leg-row.pending { border-left-color: var(--yellow); }

    .leg-btns { display: flex; gap: 4px; }
    .btn-chip {
      border: none;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .btn-chip.green { background: var(--green); color: #000; }
    .btn-chip.red { background: var(--red); color: #fff; }

    .bet-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 4px; }
    .action-btns { display: flex; gap: 10px; }

    .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .badge.pending { background: var(--yellow-bg); color: var(--yellow); }
    .badge.green { background: var(--green-bg); color: var(--green); }
    .badge.red { background: var(--red-bg); color: var(--red); }

    .btn-action { background: transparent; border: none; color: var(--subtext); cursor: pointer; font-size: 0.8rem; }
    .btn-action.edit:hover { color: var(--blue); }
    .btn-action.del:hover { color: var(--red); }
  </style>
</head>
<body>

  <header>
    <h1>BET MANAGER <span>PRO</span></h1>
  </header>

  <!-- Lista Completa de Times BR e Europa -->
  <datalist id="teamsDatalist"></datalist>

  <!-- Metrics Dashboard -->
  <div class="metrics-grid">
    <div class="metric-card">
      <h4>Banca Atual</h4>
      <div class="val" id="currentBank" style="color: var(--green);">R$ 0,00</div>
      <div class="sub-val" id="bankGrowth" style="color: var(--subtext);">0.0% do Inicial</div>
    </div>
    <div class="metric-card">
      <h4>Lucro Líquido</h4>
      <div class="val" id="netProfit">R$ 0,00</div>
      <div class="sub-val" id="yieldRate" style="color: var(--subtext);">Yield: 0%</div>
    </div>
    <div class="metric-card">
      <h4>Entradas vs Saídas</h4>
      <div class="val" id="cashFlow" style="font-size: 0.9rem; color: var(--blue);">R$ 0 / R$ 0</div>
      <div class="sub-val" style="color: var(--subtext);">Apostado / Retornado</div>
    </div>
    <div class="metric-card">
      <h4>Taxa de Acerto</h4>
      <div class="val" id="winRate">0%</div>
      <div class="sub-val" id="finishedBetsCount" style="color: var(--subtext);">0 Bilhetes Fechados</div>
    </div>
  </div>

  <!-- Configurações de Banca -->
  <div class="bank-box">
    <div class="bank-row">
      <label for="initialBankInput">Banca Inicial (R$):</label>
      <input type="number" id="initialBankInput" step="0.01" placeholder="Ex: 100,00" onchange="updateInitialBank(this.value)">
    </div>
    <div class="backup-row">
      <button class="btn-sec" onclick="exportData()">💾 Backup JSON</button>
      <button class="btn-sec" onclick="importData()">📂 Restaurar</button>
      <button class="btn-sec" style="color: var(--red);" onclick="resetAll()">⚠️ Resetar</button>
    </div>
  </div>

  <!-- Formulario -->
  <form id="betForm">
    <div class="form-title">
      <span id="formTitleText">📌 Novo Bilhete de Aposta</span>
      <button type="button" id="cancelEditBtn" class="btn-sec" style="display:none; width:auto; font-size:0.75rem; color:var(--red);" onclick="cancelEdit()">✖ Cancelar Edição</button>
    </div>

    <input type="date" id="betDate" required>

    <div class="match-inputs">
      <input type="text" id="homeTeam" list="teamsDatalist" placeholder="Mandante (Ex: Flamengo / Real Madrid)" required autocomplete="off">
      <span class="match-vs">X</span>
      <input type="text" id="awayTeam" list="teamsDatalist" placeholder="Visitante (Ex: Palmeiras / Barcelona)" required autocomplete="off">
    </div>

    <!-- Seletor de Mercado Extensivo -->
    <div class="market-selector-box">
      <span class="selector-title">Selecione o Mercado Rápido</span>
      
      <div class="selector-row">
        <select id="categorySelect" onchange="handleCategoryChange()"></select>
      </div>

      <div class="selector-row">
        <select id="marketOptionSelect"></select>
        <button type="button" class="btn-sec btn-blue" style="width: auto; white-space: nowrap;" onclick="addSelectedLeg()">➕ Add</button>
      </div>

      <div style="border-top: 1px solid var(--border); padding-top: 8px; margin-top: 2px;">
        <span class="selector-title">Ou digite uma opção customizada:</span>
        <div class="selector-row" style="margin-top: 6px;">
          <input type="text" id="customMarketInput" placeholder="Ex: Vini Jr dar 2+ chutes no gol" autocomplete="off">
          <button type="button" class="btn-sec" style="width: auto; white-space: nowrap;" onclick="addCustomLeg()">➕ Add Custom</button>
        </div>
      </div>
    </div>

    <!-- Lista de seleções do bilhete -->
    <div id="builderList" class="builder-list"></div>

    <div style="display: flex; gap: 10px;">
      <input type="number" step="0.01" id="stake" placeholder="Stake / Valor (R$)" required>
      <input type="number" step="0.01" id="odds" placeholder="Odd Total (Ex: 1.85)" required>
    </div>

    <button type="submit" id="formSubmitBtn" class="btn-main">Cadastrar Bilhete de Aposta</button>
  </form>

  <!-- Filtros e Busca por Time -->
  <div class="controls-bar">
    <input type="text" id="searchTeamInput" list="teamsDatalist" placeholder="🔍 Buscar por time (ex: Flamengo, Real Madrid)..." oninput="render()">
    <div class="filters-bar">
      <button class="filter-btn active" onclick="setFilter('all', this)">Todas</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">Pendentes</button>
      <button class="filter-btn" onclick="setFilter('green', this)">Greens 🟢</button>
      <button class="filter-btn" onclick="setFilter('red', this)">Reds 🔴</button>
    </div>
  </div>

  <!-- Lista de Apostas -->
  <div id="betsList"></div>

  <script>
    const daysOfWeek = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

    // Base de Times Brasil e Europa para Autocomplete Solido
    const defaultTeamsList = [
      // Brasil - Série A/B e Principais
      "Flamengo", "Palmeiras", "São Paulo", "Corinthians", "Fluminense", "Botafogo", "Vasco da Gama",
      "Grêmio", "Internacional", "Atlético-MG", "Cruzeiro", "Santos", "Bahia", "Fortaleza",
      "Athletico-PR", "Red Bull Bragantino", "Juventude", "Criciúma", "Atlético-GO", "Ceará",
      "Sport Recife", "Mirassol", "Novorizontino", "Coritiba", "Goiás", "Avaí", "Ponte Preta", "Guarani",
      // Espanha
      "Real Madrid", "Barcelona", "Atlético de Madrid", "Girona", "Athletic Bilbao", "Real Sociedad", "Sevilla", "Real Betis", "Villarreal",
      // Inglaterra
      "Manchester City", "Arsenal", "Liverpool", "Chelsea", "Manchester United", "Tottenham", "Aston Villa", "Newcastle", "West Ham", "Brighton",
      // Itália
      "Inter de Milão", "AC Milan", "Juventus", "Napoli", "Roma", "Lazio", "Atalanta", "Fiorentina",
      // Alemanha
      "Bayern de Munique", "Bayer Leverkusen", "Borussia Dortmund", "RB Leipzig", "Eintracht Frankfurt",
      // França & Portugal
      "PSG", "Monaco", "Lille", "Marseille", "Benfica", "Sporting", "Porto"
    ];

    // Gerador de Mercados com Linhas Extensas (Betano Style)
    function gerarMercadosCompletos() {
      const cats = {
        "⚽ Gols (Geral, Casa & Fora)": [],
        "🎯 Chutes e Finalizações": [],
        "🚩 Escanteios (Geral, Casa & Fora)": [],
        "🟨 Cartões": [],
        "🚨 Faltas & Impedimentos": [],
        "🏆 Resultado & Principais": [
          "Resultado Final: Vitória Mandante (1)",
          "Resultado Final: Empate (X)",
          "Resultado Final: Vitória Visitante (2)",
          "Dupla Chance: Mandante ou Empate (1X)",
          "Dupla Chance: Visitante ou Empate (X2)",
          "Dupla Chance: Mandante ou Visitante (12)",
          "Empate Anula Aposta: Mandante",
          "Empate Anula Aposta: Visitante",
          "Ambas as Equipes Marcam: Sim",
          "Ambas as Equipes Marcam: Não"
        ],
        "👤 Jogadores": [
          "Jogador para Marcar a Qualquer Momento",
          "Jogador para Dar Assistência",
          "Jogador para Receber Cartão Amarelo",
          "Jogador para Dar 1+ Chutes no Gol",
          "Jogador para Dar 2+ Chutes no Gol",
          "Jogador para Dar 3+ Chutes no Gol",
          "Jogador para Dar 1+ Chutes Totais",
          "Jogador para Dar 2+ Chutes Totais",
          "Jogador para Dar 3+ Chutes Totais",
          "Jogador para Sofrer 1+ Faltas",
          "Jogador para Sofrer 2+ Faltas",
          "Jogador para Dar 1+ Faltas",
          "Jogador para Dar 2+ Faltas",
          "Jogador para Fazer 1+ Desarmes"
        ]
      };

      // GOLS (Geral + Mandante/Casa + Visitante/Fora)
      for (let i = 0.5; i <= 8.5; i += 1.0) {
        cats["⚽ Gols (Geral, Casa & Fora)"].push(`Mais de ${i.toFixed(1)} Gols na Partida`);
        cats["⚽ Gols (Geral, Casa & Fora)"].push(`Menos de ${i.toFixed(1)} Gols na Partida`);
      }
      for (let i = 0.5; i <= 5.5; i += 1.0) {
        cats["⚽ Gols (Geral, Casa & Fora)"].push(`Mandante (Casa): Mais de ${i.toFixed(1)} Gols`);
        cats["⚽ Gols (Geral, Casa & Fora)"].push(`Mandante (Casa): Menos de ${i.toFixed(1)} Gols`);
        cats["⚽ Gols (Geral, Casa & Fora)"].push(`Visitante (Fora): Mais de ${i.toFixed(1)} Gols`);
        cats["⚽ Gols (Geral, Casa & Fora)"].push(`Visitante (Fora): Menos de ${i.toFixed(1)} Gols`);
      }

      // CHUTES E FINALIZAÇÕES (Expandido até +18.5 / +32.5)
      for (let i = 0.5; i <= 18.5; i += 1.0) {
        cats["🎯 Chutes e Finalizações"].push(`Chutes no Gol: Mais de ${i.toFixed(1)} na Partida`);
        cats["🎯 Chutes e Finalizações"].push(`Mandante - Chutes no Gol: Mais de ${i.toFixed(1)}`);
        cats["🎯 Chutes e Finalizações"].push(`Visitante - Chutes no Gol: Mais de ${i.toFixed(1)}`);
      }
      for (let i = 0.5; i <= 32.5; i += 1.0) {
        cats["🎯 Chutes e Finalizações"].push(`Chutes Totais: Mais de ${i.toFixed(1)} na Partida`);
        cats["🎯 Chutes e Finalizações"].push(`Mandante - Chutes Totais: Mais de ${i.toFixed(1)}`);
        cats["🎯 Chutes e Finalizações"].push(`Visitante - Chutes Totais: Mais de ${i.toFixed(1)}`);
      }

      // ESCANTEIOS (0.5 até 22.5)
      for (let i = 0.5; i <= 22.5; i += 1.0) {
        cats["🚩 Escanteios (Geral, Casa & Fora)"].push(`Mais de ${i.toFixed(1)} Escanteios na Partida`);
        cats["🚩 Escanteios (Geral, Casa & Fora)"].push(`Menos de ${i.toFixed(1)} Escanteios na Partida`);
      }
      for (let i = 0.5; i <= 14.5; i += 1.0) {
        cats["🚩 Escanteios (Geral, Casa & Fora)"].push(`Mandante (Casa): Mais de ${i.toFixed(1)} Escanteios`);
        cats["🚩 Escanteios (Geral, Casa & Fora)"].push(`Visitante (Fora): Mais de ${i.toFixed(1)} Escanteios`);
      }

      // CARTÕES
      for (let i = 0.5; i <= 12.5; i += 1.0) {
        cats["🟨 Cartões"].push(`Cartões Totais: Mais de ${i.toFixed(1)}`);
        cats["🟨 Cartões"].push(`Cartões Totais: Menos de ${i.toFixed(1)}`);
      }
      for (let i = 0.5; i <= 6.5; i += 1.0) {
        cats["🟨 Cartões"].push(`Mandante (Casa): Mais de ${i.toFixed(1)} Cartões`);
        cats["🟨 Cartões"].push(`Visitante (Fora): Mais de ${i.toFixed(1)} Cartões`);
      }

      // FALTAS E IMPEDIMENTOS
      for (let i = 8.5; i <= 38.5; i += 1.0) {
        cats["🚨 Faltas & Impedimentos"].push(`Faltas Totais: Mais de ${i.toFixed(1)}`);
      }
      for (let i = 0.5; i <= 10.5; i += 1.0) {
        cats["🚨 Faltas & Impedimentos"].push(`Impedimentos: Mais de ${i.toFixed(1)}`);
      }

      return cats;
    }

    let marketCategories = gerarMercadosCompletos();
    let bets = JSON.parse(localStorage.getItem('myBets')) || [];
    let initialBank = parseFloat(localStorage.getItem('initialBank')) || 0;
    let currentFilter = 'all';
    let tempLegs = [];
    let editingBetId = null;

    document.getElementById('betDate').valueAsDate = new Date();
    document.getElementById('initialBankInput').value = initialBank ? initialBank : '';

    function initCategorySelectors() {
      const catSelect = document.getElementById('categorySelect');
      catSelect.innerHTML = Object.keys(marketCategories).map(cat => `<option value="${cat}">${cat}</option>`).join('');
      handleCategoryChange();
    }

    function handleCategoryChange() {
      const selectedCat = document.getElementById('categorySelect').value;
      const optionSelect = document.getElementById('marketOptionSelect');
      const options = marketCategories[selectedCat] || [];

      optionSelect.innerHTML = options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
    }

    function addSelectedLeg() {
      const optSelect = document.getElementById('marketOptionSelect');
      const val = optSelect.value;
      if (val) {
        tempLegs.push({ id: Date.now() + Math.random(), name: val, status: 'pending' });
        renderBuilder();
      }
    }

    function addCustomLeg() {
      const input = document.getElementById('customMarketInput');
      const val = input.value.trim();
      if (val) {
        tempLegs.push({ id: Date.now() + Math.random(), name: val, status: 'pending' });
        input.value = '';
        renderBuilder();
      }
    }

    function removeLegFromForm(id) {
      tempLegs = tempLegs.filter(l => l.id !== id);
      renderBuilder();
    }

    function renderBuilder() {
      const container = document.getElementById('builderList');
      container.innerHTML = tempLegs.map(l => `
        <div class="builder-item">
          <span>📌 ${l.name}</span>
          <button type="button" style="background:none; border:none; color:var(--red); cursor:pointer; font-weight:bold;" onclick="removeLegFromForm(${l.id})">✖</button>
        </div>
      `).join('');
    }

    function updateTeamDatalist() {
      const datalist = document.getElementById('teamsDatalist');
      const teamSet = new Set(defaultTeamsList);

      bets.forEach(b => {
        if (b.match) {
          const parts = b.match.split(' x ');
          parts.forEach(p => p && teamSet.add(p.trim()));
        }
      });

      datalist.innerHTML = Array.from(teamSet).sort().map(t => `<option value="${t}">`).join('');
    }

    function updateInitialBank(val) {
      initialBank = parseFloat(val) || 0;
      localStorage.setItem('initialBank', initialBank);
      render();
    }

    document.getElementById('betForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const dateVal = document.getElementById('betDate').value;
      const home = document.getElementById('homeTeam').value.trim();
      const away = document.getElementById('awayTeam').value.trim();
      const match = (home && away) ? `${home} x ${away}` : (home || away);
      
      const stake = parseFloat(document.getElementById('stake').value);
      const odds = parseFloat(document.getElementById('odds').value);

      if (tempLegs.length === 0) {
        alert("Por favor, selecione ou digite ao menos uma seleção para o bilhete.");
        return;
      }

      if (editingBetId) {
        const idx = bets.findIndex(b => b.id === editingBetId);
        if (idx !== -1) {
          bets[idx] = {
            ...bets[idx],
            date: dateVal,
            match,
            stake,
            odds,
            legs: tempLegs
          };
        }
        cancelEdit();
      } else {
        bets.unshift({
          id: Date.now(),
          date: dateVal,
          match,
          stake,
          odds,
          status: 'pending',
          legs: tempLegs
        });
        tempLegs = [];
        renderBuilder();
        e.target.reset();
        document.getElementById('betDate').valueAsDate = new Date();
      }

      saveAndUpdate();
    });

    // Edição completa de Bilhetes
    function editBet(id) {
      const bet = bets.find(b => b.id === id);
      if (!bet) return;

      editingBetId = bet.id;
      document.getElementById('betDate').value = bet.date;
      
      const parts = (bet.match || '').split(' x ');
      document.getElementById('homeTeam').value = parts[0] || '';
      document.getElementById('awayTeam').value = parts[1] || '';
      
      document.getElementById('stake').value = bet.stake;
      document.getElementById('odds').value = bet.odds;
      
      tempLegs = JSON.parse(JSON.stringify(bet.legs || []));
      renderBuilder();

      document.getElementById('formTitleText').textContent = "✏️ Editando Bilhete";
      document.getElementById('formSubmitBtn').textContent = "💾 Salvar Alterações";
      document.getElementById('cancelEditBtn').style.display = "block";
      document.getElementById('betForm').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEdit() {
      editingBetId = null;
      tempLegs = [];
      renderBuilder();
      document.getElementById('betForm').reset();
      document.getElementById('betDate').valueAsDate = new Date();
      document.getElementById('formTitleText').textContent = "📌 Novo Bilhete de Aposta";
      document.getElementById('formSubmitBtn').textContent = "Cadastrar Bilhete de Aposta";
      document.getElementById('cancelEditBtn').style.display = "none";
    }

    function toggleLegStatus(betId, legId, newStatus) {
      const bet = bets.find(b => b.id === betId);
      if (bet) {
        const leg = bet.legs.find(l => l.id === legId);
        if (leg) {
          leg.status = (leg.status === newStatus) ? 'pending' : newStatus;
        }

        const hasRed = bet.legs.some(l => l.status === 'red');
        const allGreen = bet.legs.every(l => l.status === 'green');

        if (hasRed) {
          bet.status = 'red';
        } else if (allGreen && bet.legs.length > 0) {
          bet.status = 'green';
        } else {
          bet.status = 'pending';
        }

        saveAndUpdate();
      }
    }

    function deleteBet(id) {
      if (confirm("Deseja apagar este bilhete?")) {
        bets = bets.filter(b => b.id !== id);
        saveAndUpdate();
      }
    }

    function resetAll() {
      if (confirm("⚠️ Deseja resetar todo o histórico de apostas?")) {
        bets = [];
        initialBank = 0;
        localStorage.removeItem('myBets');
        localStorage.removeItem('initialBank');
        document.getElementById('initialBankInput').value = '';
        render();
      }
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function saveAndUpdate() {
      localStorage.setItem('myBets', JSON.stringify(bets));
      updateTeamDatalist();
      render();
    }

    function formatDateFormatted(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return `${daysOfWeek[d.getDay()]}, ${parts[2]}/${parts[1]}`;
    }

    function render() {
      const list = document.getElementById('betsList');
      const searchQuery = document.getElementById('searchTeamInput').value.toLowerCase().trim();
      list.innerHTML = '';

      let totalStaked = 0;
      let totalReturned = 0;
      let greens = 0;
      let finishedCount = 0;

      bets.forEach(b => {
        let betReturn = 0;
        if (b.status === 'green') {
          betReturn = b.stake * b.odds;
          totalStaked += b.stake;
          totalReturned += betReturn;
          greens++;
          finishedCount++;
        } else if (b.status === 'red') {
          betReturn = 0;
          totalStaked += b.stake;
          finishedCount++;
        }

        if (currentFilter !== 'all' && b.status !== currentFilter) return;
        if (searchQuery && !b.match.toLowerCase().includes(searchQuery)) return;

        const potentialReturn = b.stake * b.odds;
        const potentialProfit = potentialReturn - b.stake;
        const netBetProfit = b.status === 'green' ? potentialProfit : (b.status === 'red' ? -b.stake : 0);

        const div = document.createElement('div');
        div.className = 'bet-card';

        const legsHtml = (b.legs || []).map(l => `
          <div class="leg-row ${l.status}">
            <span>${l.status === 'green' ? '✅' : l.status === 'red' ? '❌' : '⏳'} ${l.name}</span>
            <div class="leg-btns">
              <button class="btn-chip green" onclick="toggleLegStatus(${b.id}, ${l.id}, 'green')">GREEN</button>
              <button class="btn-chip red" onclick="toggleLegStatus(${b.id}, ${l.id}, 'red')">RED</button>
            </div>
          </div>
        `).join('');

        let badgeClass = 'pending';
        let badgeText = 'PENDENTE';
        if (b.status === 'green') { badgeClass = 'green'; badgeText = 'GREEN 🟢'; }
        if (b.status === 'red') { badgeClass = 'red'; badgeText = 'RED 🔴'; }

        div.innerHTML = `
          <div class="bet-head">
            <div>
              <div class="bet-date">📅 ${formatDateFormatted(b.date)}</div>
              <div class="bet-match">${b.match}</div>
            </div>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>

          <div class="fin-box">
            <div class="fin-item">
              <label>Apostado</label>
              <span>R$ ${b.stake.toFixed(2)}</span>
            </div>
            <div class="fin-item">
              <label>Odd</label>
              <span>@ ${b.odds.toFixed(2)}</span>
            </div>
            <div class="fin-item">
              <label>Retorno</label>
              <span style="color:var(--blue)">R$ ${potentialReturn.toFixed(2)}</span>
            </div>
            <div class="fin-item">
              <label>Lucro</label>
              <span style="color: ${b.status === 'green' ? 'var(--green)' : b.status === 'red' ? 'var(--red)' : 'var(--yellow)'}">
                ${b.status === 'pending' ? '+R$ ' + potentialProfit.toFixed(2) : (netBetProfit >= 0 ? '+R$ ' + netBetProfit.toFixed(2) : '-R$ ' + Math.abs(netBetProfit).toFixed(2))}
              </span>
            </div>
          </div>

          <div class="legs-container">
            ${legsHtml}
          </div>

          <div class="bet-foot">
            <span style="font-size:0.75rem; color:var(--subtext);">${(b.legs || []).length} seleção(ões)</span>
            <div class="action-btns">
              <button class="btn-action edit" onclick="editBet(${b.id})">✏️ Editar</button>
              <button class="btn-action del" onclick="deleteBet(${b.id})">🗑️ Apagar</button>
            </div>
          </div>
        `;

        list.appendChild(div);
      });

      const netProfit = totalReturned - totalStaked;
      const currentBank = initialBank + netProfit;
      const bankGrowth = initialBank > 0 ? ((netProfit / initialBank) * 100) : 0;
      const yieldRate = totalStaked > 0 ? ((netProfit / totalStaked) * 100) : 0;

      document.getElementById('currentBank').textContent = `R$ ${currentBank.toFixed(2)}`;
      document.getElementById('bankGrowth').textContent = `${bankGrowth >= 0 ? '+' : ''}${bankGrowth.toFixed(1)}% de crescimento`;
      document.getElementById('bankGrowth').style.color = bankGrowth >= 0 ? 'var(--green)' : 'var(--red)';

      document.getElementById('netProfit').textContent = `${netProfit >= 0 ? '+' : ''}R$ ${netProfit.toFixed(2)}`;
      document.getElementById('netProfit').style.color = netProfit >= 0 ? 'var(--green)' : 'var(--red)';
      
      document.getElementById('yieldRate').textContent = `Yield: ${yieldRate.toFixed(1)}%`;
      document.getElementById('cashFlow').textContent = `R$ ${totalStaked.toFixed(2)} / R$ ${totalReturned.toFixed(2)}`;
      
      document.getElementById('winRate').textContent = finishedCount ? `${((greens / finishedCount) * 100).toFixed(1)}%` : '0%';
      document.getElementById('finishedBetsCount').textContent = `${finishedCount} de ${bets.length} bilhetes fechados`;
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ bets, initialBank }));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", `banca_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchorElem.click();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file, 'UTF-8');
        reader.onload = readerEvent => {
          try {
            const content = JSON.parse(readerEvent.target.result);
            if (content.bets) {
              bets = content.bets;
              initialBank = content.initialBank || 0;
              document.getElementById('initialBankInput').value = initialBank;
              saveAndUpdate();
            }
          } catch (err) {
            alert("Erro ao ler backup.");
          }
        }
      }
      input.click();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initCategorySelectors();
      updateTeamDatalist();
      render();
    });
  </script>
</body>
</html>
