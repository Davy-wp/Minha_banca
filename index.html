<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Banca Betano Pro</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #202024;
      --border: #29292e;
      --text: #e1e1e6;
      --subtext: #a8a8b3;
      --green: #00875f;
      --green-text: #00b37e;
      --red: #f75a68;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 15px;
      margin: 0;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    h2 { text-align: center; margin-top: 5px; margin-bottom: 15px; font-size: 1.3rem; color: #fff; }

    /* Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .card h4 { margin: 0; font-size: 0.7rem; color: var(--subtext); text-transform: uppercase; }
    .card p { margin: 6px 0 0; font-size: 1.1rem; font-weight: bold; }

    /* Banca Setup & Backup */
    .bank-setup {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bank-row { display: flex; gap: 8px; align-items: center; }
    .bank-row label { font-size: 0.85rem; color: var(--subtext); min-width: 90px; }

    /* Forms & Inputs */
    form {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, select, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      background: #121214;
      color: #fff;
      box-sizing: border-box;
      width: 100%;
    }

    input:focus, select:focus { outline: 1px solid var(--green); }

    .btn-add { background: var(--green); color: #fff; font-weight: bold; border: none; cursor: pointer; }
    .btn-add:active { opacity: 0.8; }

    /* Filters */
    .filters {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      overflow-x: auto;
    }

    .btn-filter {
      background: var(--card-bg);
      color: var(--subtext);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-filter.active { background: var(--green); color: #fff; border-color: var(--green); }

    /* Bet List */
    .bet-item {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bet-info { display: flex; flex-direction: column; gap: 3px; }
    .bet-date { font-size: 0.75rem; color: var(--subtext); font-weight: bold; }
    .bet-title { font-size: 1rem; font-weight: bold; color: #fff; }
    .bet-details { font-size: 0.85rem; color: var(--subtext); }

    .actions { display: flex; gap: 6px; align-items: center; }
    .btn-green { background: var(--green); color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-red { background: var(--red); color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-del { background: #29292e; color: #a8a8b3; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }

    .green-text { color: var(--green-text); font-weight: bold; }
    .red-text { color: var(--red); font-weight: bold; }

    .backup-actions { display: flex; gap: 8px; margin-top: 5px; }
    .btn-sec { background: #29292e; color: #fff; border: none; padding: 8px; font-size: 0.8rem; cursor: pointer; }
  </style>
</head>
<body>

  <h2>📊 Gestor de Banca Automatizado</h2>

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="card"><h4>BANCA ATUAL</h4><p id="currentBank">R$ 0.00</p></div>
    <div class="card"><h4>LUCRO LÍQUIDO</h4><p id="totalProfit">R$ 0.00</p></div>
    <div class="card"><h4>TAXA DE ACERTO</h4><p id="winRate">0%</p></div>
    <div class="card"><h4>YIELD (RETORNO)</h4><p id="yield">0%</p></div>
  </div>

  <!-- Configuração de Banca Inicial e Ferramentas -->
  <div class="bank-setup">
    <div class="bank-row">
      <label for="initialBankInput">Banca Inicial:</label>
      <input type="number" id="initialBankInput" step="0.01" placeholder="Ex: 100.00" onchange="updateInitialBank(this.value)">
    </div>
    <div class="backup-actions">
      <button class="btn-sec" onclick="exportData()">💾 Exportar Backup</button>
      <button class="btn-sec" onclick="importData()">📂 Importar Backup</button>
      <button class="btn-sec" style="color: var(--red);" onclick="resetAll()">⚠️ Resetar Tudo</button>
    </div>
  </div>

  <!-- Formulário de Cadastro de Aposta -->
  <form id="betForm">
    <!-- Seletor de Data -->
    <input type="date" id="betDate" required>

    <!-- Autocomplete de Times -->
    <input type="text" id="match" list="teamsList" placeholder="Selecione ou Digite o Time / Confronto" required autocomplete="off">
    <datalist id="teamsList">
      <!-- Brasileirão -->
      <option value="Flamengo"><option value="Palmeiras"><option value="São Paulo"><option value="Corinthians">
      <option value="Fluminense"><option value="Vasco da Gama"><option value="Botafogo"><option value="Grêmio">
      <option value="Internacional"><option value="Atlético-MG"><option value="Cruzeiro"><option value="Bahia">
      <option value="Fortaleza"><option value="Athletico-PR"><option value="Santos"><option value="Ceará">
      <option value="Sport Recife"><option value="Vitória"><option value="Juventude"><option value="Criciúma">
      <!-- Internacionais -->
      <option value="Real Madrid"><option value="Barcelona"><option value="Manchester City"><option value="Liverpool">
      <option value="Arsenal"><option value="Bayern de Munique"><option value="PSG"><option value="Juventus">
      <option value="Inter de Milão"><option value="Al-Hilal"><option value="Al-Nassr"><option value="Boca Juniors">
    </datalist>

    <!-- Autocomplete de Mercados -->
    <input type="text" id="market" list="marketsList" placeholder="Selecione ou Digite o Mercado" required autocomplete="off">
    <datalist id="marketsList">
      <option value="Chance Dupla (1X)">
      <option value="Chance Dupla (X2)">
      <option value="Chance Dupla (12 - Qualquer time vence)">
      <option value="Resultado Final (Vitória Casa - 1)">
      <option value="Resultado Final (Vitória Visitante - 2)">
      <option value="Finalizações Totais (Chutes ao Gol)">
      <option value="Ambas as Equipes Marcam (Sim)">
      <option value="Ambas as Equipes Marcam (Não)">
      <option value="Mais de 1.5 Gols (Over 1.5)">
      <option value="Mais de 2.5 Gols (Over 2.5)">
      <option value="Menos de 2.5 Gols (Under 2.5)">
      <option value="Escanteios Totais (Mais de 8.5)">
      <option value="Escanteios Totais (Mais de 9.5)">
      <option value="Escanteios Totais (Mais de 10.5)">
      <option value="Empate Anula Aposta (DNB)">
      <option value="Handicap Asiático">
      <option value="Criar Aposta (Combinada)">
      <option value="Back Favorito">
      <option value="Lay Zebra / Cobertura">
      <option value="Cartões Totais">
    </datalist>

    <input type="number" step="0.01" id="stake" placeholder="Stake / Valor Apostado (R$)" required>
    <input type="number" step="0.01" id="odds" placeholder="Odd (Ex: 1.85)" required>

    <button type="submit" class="btn-add">Cadastrar Aposta</button>
  </form>

  <!-- Filtros de Visualização -->
  <div class="filters">
    <button class="btn-filter active" onclick="setFilter('all', this)">Todas</button>
    <button class="btn-filter" onclick="setFilter('pending', this)">Pendentes</button>
    <button class="btn-filter" onclick="setFilter('green', this)">Greens 🟢</button>
    <button class="btn-filter" onclick="setFilter('red', this)">Reds 🔴</button>
  </div>

  <!-- Lista de Apostas -->
  <div id="betsList"></div>

  <script>
    const daysOfWeek = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];

    let bets = JSON.parse(localStorage.getItem('myBets')) || [];
    let initialBank = parseFloat(localStorage.getItem('initialBank')) || 0;
    let currentFilter = 'all';

    // Preenche a data de hoje por padrão
    document.getElementById('betDate').valueAsDate = new Date();
    document.getElementById('initialBankInput').value = initialBank ? initialBank : '';

    function updateInitialBank(val) {
      initialBank = parseFloat(val) || 0;
      localStorage.setItem('initialBank', initialBank);
      render();
    }

    document.getElementById('betForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const dateVal = document.getElementById('betDate').value;
      const match = document.getElementById('match').value;
      const market = document.getElementById('market').value || 'Aposta Simples';
      const stake = parseFloat(document.getElementById('stake').value);
      const odds = parseFloat(document.getElementById('odds').value);

      bets.unshift({
        id: Date.now(),
        date: dateVal,
        match,
        market,
        stake,
        odds,
        status: 'pending'
      });

      saveAndUpdate();
      e.target.reset();
      document.getElementById('betDate').valueAsDate = new Date();
    });

    function resolveBet(id, status) {
      const bet = bets.find(b => b.id === id);
      if (bet) {
        bet.status = status;
        saveAndUpdate();
      }
    }

    function deleteBet(id) {
      if (confirm("Deseja apagar esta aposta especificamente?")) {
        bets = bets.filter(b => b.id !== id);
        saveAndUpdate();
      }
    }

    function resetAll() {
      if (confirm("⚠️ ATENÇÃO: Deseja apagar TODAS as apostas e zerar a banca?")) {
        bets = [];
        initialBank = 0;
        localStorage.removeItem('myBets');
        localStorage.removeItem('initialBank');
        document.getElementById('initialBankInput').value = '';
        render();
      }
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function saveAndUpdate() {
      localStorage.setItem('myBets', JSON.stringify(bets));
      render();
    }

    function formatDateFormatted(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const dayName = daysOfWeek[d.getDay()];
      return `${dayName}, ${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function render() {
      const list = document.getElementById('betsList');
      list.innerHTML = '';

      let totalProfit = 0;
      let totalStaked = 0;
      let greens = 0;
      let finishedCount = 0;

      bets.forEach(b => {
        let profit = 0;
        if (b.status === 'green') {
          profit = (b.stake * b.odds) - b.stake;
          totalProfit += profit;
          totalStaked += b.stake;
          greens++;
          finishedCount++;
        } else if (b.status === 'red') {
          profit = -b.stake;
          totalProfit += profit;
          totalStaked += b.stake;
          finishedCount++;
        }

        // Filtro de exibição
        if (currentFilter !== 'all' && b.status !== currentFilter) {
          return;
        }

        const div = document.createElement('div');
        div.className = 'bet-item';
        div.innerHTML = `
          <div class="bet-info">
            <span class="bet-date">📅 ${formatDateFormatted(b.date)}</span>
            <span class="bet-title">${b.match}</span>
            <span class="bet-details">${b.market} | R$ ${b.stake.toFixed(2)} @ <strong>${b.odds.toFixed(2)}</strong></span>
          </div>
          <div class="actions">
            ${b.status === 'pending' ? `
              <button class="btn-green" onclick="resolveBet(${b.id}, 'green')">🟢</button>
              <button class="btn-red" onclick="resolveBet(${b.id}, 'red')">🔴</button>
            ` : `<span class="${b.status === 'green' ? 'green-text' : 'red-text'}">
                ${profit > 0 ? '+' : ''}R$ ${profit.toFixed(2)}
               </span>`}
            <button class="btn-del" onclick="deleteBet(${b.id})" title="Excluir Aposta">🗑️</button>
          </div>
        `;
        list.appendChild(div);
      });

      const currentBank = initialBank + totalProfit;

      document.getElementById('currentBank').textContent = `R$ ${currentBank.toFixed(2)}`;
      document.getElementById('totalProfit').textContent = `R$ ${totalProfit.toFixed(2)}`;
      document.getElementById('totalProfit').style.color = totalProfit >= 0 ? '#00b37e' : '#f75a68';
      
      document.getElementById('winRate').textContent = finishedCount ? `${((greens / finishedCount) * 100).toFixed(1)}%` : '0%';
      document.getElementById('yield').textContent = totalStaked ? `${((totalProfit / totalStaked) * 100).toFixed(1)}%` : '0%';
    }

    // Exportar Backup
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ bets, initialBank }));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", `banca_backup_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchorElem.click();
    }

    // Importar Backup
    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file, 'UTF-8');
        reader.onload = readerEvent => {
          try {
            const content = JSON.parse(readerEvent.target.result);
            if (content.bets) {
              bets = content.bets;
              initialBank = content.initialBank || 0;
              document.getElementById('initialBankInput').value = initialBank;
              saveAndUpdate();
              alert("Backup restaurado com sucesso!");
            }
          } catch (err) {
            alert("Erro ao ler o arquivo de backup.");
          }
        }
      }
      input.click();
    }

    render();
  </script>
</body>
</html>
