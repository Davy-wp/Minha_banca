<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betano Pro Manager - Gestor de Banca</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151922;
      --card-inner: #1c2230;
      --border: #2a3142;
      --text: #f0f4fc;
      --subtext: #8c9ba5;
      --accent: #ff6b00; /* Laranja Betano */
      --green: #00e676;
      --green-bg: rgba(0, 230, 118, 0.12);
      --red: #ff5252;
      --red-bg: rgba(255, 82, 82, 0.12);
      --yellow: #ffd600;
      --yellow-bg: rgba(255, 214, 0, 0.12);
      --blue: #29b6f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px 0 18px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
    }

    header h1 span { color: var(--accent); }

    /* Dashboard Metrics */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--border);
    }

    .metric-card.accent::before { background: var(--accent); }
    .metric-card.green::before { background: var(--green); }
    .metric-card.blue::before { background: var(--blue); }

    .metric-card h4 {
      font-size: 0.7rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .metric-card .val {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .metric-card .sub-val {
      font-size: 0.75rem;
      margin-top: 2px;
      font-weight: 600;
    }

    /* Bank Settings Box */
    .bank-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bank-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bank-row label {
      font-size: 0.85rem;
      color: var(--subtext);
      white-space: nowrap;
    }

    .backup-row {
      display: flex;
      gap: 8px;
    }

    /* Form & Inputs */
    form {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .match-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .match-vs {
      font-weight: 800;
      color: var(--accent);
      font-size: 0.9rem;
    }

    input, select, button {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    /* Category Market Picker */
    .market-picker {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .picker-label {
      font-size: 0.8rem;
      color: var(--subtext);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cat-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .cat-tab {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      width: auto;
      transition: all 0.2s;
    }

    .cat-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .submarket-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .submarket-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .submarket-btn:hover {
      border-color: var(--accent);
      background: rgba(255, 107, 0, 0.1);
    }

    .custom-input-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .builder-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .builder-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-main {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(255, 107, 0, 0.25);
    }

    .btn-sec {
      background: var(--card-inner);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 8px 10px;
      border-radius: 6px;
    }

    /* Bet List Item */
    .bet-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bet-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .bet-date { font-size: 0.72rem; color: var(--subtext); font-weight: 600; text-transform: uppercase; }
    .bet-match { font-size: 1.05rem; font-weight: 800; color: #fff; margin-top: 2px; }

    .fin-box {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: var(--card-inner);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      align-items: center;
    }

    .fin-item {
      display: flex;
      flex-direction: column;
      font-size: 0.75rem;
    }

    .fin-item label { color: var(--subtext); font-size: 0.65rem; text-transform: uppercase; font-weight: 700; }
    .fin-item span { font-weight: 700; margin-top: 2px; }

    .legs-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .leg-row {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-left: 4px solid var(--subtext);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .leg-row.green { border-left-color: var(--green); }
    .leg-row.red { border-left-color: var(--red); }
    .leg-row.pending { border-left-color: var(--yellow); }

    .leg-btns { display: flex; gap: 4px; }
    .btn-chip {
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .btn-chip.green { background: var(--green); color: #000; }
    .btn-chip.red { background: var(--red); color: #fff; }

    .bet-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .badge.pending { background: var(--yellow-bg); color: var(--yellow); }
    .badge.green { background: var(--green-bg); color: var(--green); }
    .badge.red { background: var(--red-bg); color: var(--red); }

    .btn-del {
      background: transparent;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-del:hover { color: var(--red); }

    .filters-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <h1>BETANO <span>PRO MANAGER</span></h1>
  </header>

  <!-- Painel de Finanças e Lucro -->
  <div class="metrics-grid">
    <div class="metric-card accent">
      <h4>Banca Atual</h4>
      <div class="val" id="currentBank">R$ 0,00</div>
      <div class="sub-val" id="bankGrowth" style="color: var(--subtext);">0.0% do Inicial</div>
    </div>
    <div class="metric-card green">
      <h4>Lucro Líquido</h4>
      <div class="val" id="netProfit">R$ 0,00</div>
      <div class="sub-val" id="yieldRate" style="color: var(--green);">Yield: 0%</div>
    </div>
    <div class="metric-card blue">
      <h4>Entradas vs Saídas</h4>
      <div class="val" id="cashFlow" style="font-size: 0.95rem;">R$ 0 / R$ 0</div>
      <div class="sub-val" style="color: var(--subtext);">Apostado / Retornado</div>
    </div>
    <div class="metric-card">
      <h4>Taxa de Acerto</h4>
      <div class="val" id="winRate">0%</div>
      <div class="sub-val" id="finishedBetsCount" style="color: var(--subtext);">0 Bilhetes Resolvidos</div>
    </div>
  </div>

  <!-- Configuração de Banca e Backup -->
  <div class="bank-box">
    <div class="bank-row">
      <label for="initialBankInput">Banca Inicial (R$):</label>
      <input type="number" id="initialBankInput" step="0.01" placeholder="Ex: 100,00" onchange="updateInitialBank(this.value)">
    </div>
    <div class="backup-row">
      <button class="btn-sec" onclick="exportData()">💾 Backup JSON</button>
      <button class="btn-sec" onclick="importData()">📂 Restaurar</button>
      <button class="btn-sec" style="color: var(--red);" onclick="resetAll()">⚠️ Resetar</button>
    </div>
  </div>

  <!-- Form de Cadastro de Bilhete -->
  <form id="betForm">
    <div class="form-title">📌 Novo Bilhete de Aposta</div>

    <input type="date" id="betDate" required>

    <div class="match-inputs">
      <input type="text" id="homeTeam" placeholder="Mandante (Ex: Flamengo)" required autocomplete="off">
      <span class="match-vs">X</span>
      <input type="text" id="awayTeam" placeholder="Visitante (Ex: Palmeiras)" required autocomplete="off">
    </div>

    <!-- Seletor Dinâmico de Categorias Betano -->
    <div class="market-picker">
      <span class="picker-label">Selecione o Mercado (Clique para Inserir)</span>
      
      <!-- Abas Geradas Dinamicamente via JS/JSON -->
      <div class="cat-tabs" id="catTabsContainer"></div>

      <!-- Submercados dinâmicos da categoria ativa -->
      <div id="submarketContainer" class="submarket-grid"></div>

      <!-- Opção de Texto Livre para Linhas Personalizadas -->
      <div class="custom-input-row">
        <input type="text" id="customMarketInput" placeholder="Ou digite uma linha específica..." autocomplete="off">
        <button type="button" class="btn-sec" style="width: auto; white-space: nowrap;" onclick="addCustomLeg()">➕ Add</button>
      </div>
    </div>

    <!-- Lista de seleções adicionadas ao bilhete -->
    <div id="builderList" class="builder-list"></div>

    <!-- Financeiro da Aposta -->
    <div style="display: flex; gap: 10px;">
      <input type="number" step="0.01" id="stake" placeholder="Stake / Valor (R$)" required>
      <input type="number" step="0.01" id="odds" placeholder="Odd Total (Ex: 1.85)" required>
    </div>

    <button type="submit" class="btn-main">Cadastrar Bilhete de Aposta</button>
  </form>

  <!-- Filtros -->
  <div class="filters-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">Todas</button>
    <button class="filter-btn" onclick="setFilter('pending', this)">Pendentes</button>
    <button class="filter-btn" onclick="setFilter('green', this)">Greens 🟢</button>
    <button class="filter-btn" onclick="setFilter('red', this)">Reds 🔴</button>
  </div>

  <!-- Lista de Apostas -->
  <div id="betsList"></div>

  <script>
    const daysOfWeek = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

    // Lista Completa Padrão (utilizada caso mercados.json não seja encontrado localmente)
    let marketCategories = {
      "Gols & Ambas": [
        "Ambas as Equipes Marcam: Sim",
        "Ambas as Equipes Marcam: Não",
        "Mais de 0.5 Gols na Partida",
        "Mais de 1.5 Gols na Partida",
        "Mais de 2.5 Gols na Partida",
        "Mais de 3.5 Gols na Partida",
        "Menos de 2.5 Gols na Partida",
        "Menos de 3.5 Gols na Partida",
        "Mais de 0.5 Gols no 1º Tempo",
        "Mais de 1.5 Gols no 1º Tempo",
        "Mandante: Mais de 0.5 Gols",
        "Mandante: Mais de 1.5 Gols",
        "Visitante: Mais de 0.5 Gols",
        "Visitante: Mais de 1.5 Gols"
      ],
      "Escanteios": [
        "Escanteios: Mais de 7.5 na Partida",
        "Escanteios: Mais de 8.5 na Partida",
        "Escanteios: Mais de 9.5 na Partida",
        "Escanteios: Mais de 10.5 na Partida",
        "Escanteios: Mais de 11.5 na Partida",
        "Escanteios: Menos de 10.5 na Partida",
        "Escanteios: Menos de 11.5 na Partida",
        "Mandante Escanteios: Mais de 3.5",
        "Mandante Escanteios: Mais de 4.5",
        "Mandante Escanteios: Mais de 5.5",
        "Visitante Escanteios: Mais de 3.5",
        "Visitante Escanteios: Mais de 4.5",
        "Visitante Escanteios: Mais de 5.5",
        "Escanteios 1º Tempo: Mais de 4.5"
      ],
      "Chutes do Jogador": [
        "Chutes no Gol: Jogador +0.5 no Gol",
        "Chutes no Gol: Jogador +1.5 no Gol",
        "Chutes no Gol: Jogador +2.5 no Gol",
        "Chutes Totais: Jogador +1.5 Chutes",
        "Chutes Totais: Jogador +2.5 Chutes",
        "Chutes Totais: Jogador +3.5 Chutes",
        "Jogador para Marcar a Qualquer Momento",
        "Jogador para dar Assistência"
      ],
      "Chutes da Equipe": [
        "Chutes no Gol: Mais de 7.5 na Partida",
        "Chutes no Gol: Mais de 8.5 na Partida",
        "Chutes no Gol: Mais de 9.5 na Partida",
        "Chutes Totais: Mandante +11.5 Chutes",
        "Chutes Totais: Mandante +13.5 Chutes",
        "Chutes Totais: Visitante +8.5 Chutes",
        "Chutes Totais: Visitante +10.5 Chutes"
      ],
      "Cartões": [
        "Ambas as Equipes Recebem Cartão",
        "Mais de 3.5 Cartões Amarelos",
        "Mais de 4.5 Cartões Amarelos",
        "Mais de 5.5 Cartões Amarelos",
        "Menos de 5.5 Cartões Amarelos",
        "Mandante Cartões: Mais de 1.5",
        "Visitante Cartões: Mais de 1.5",
        "Jogador para Receber Cartão"
      ],
      "Resultado Final": [
        "Resultado Final: Vitória Mandante (1)",
        "Resultado Final: Empate (X)",
        "Resultado Final: Vitória Visitante (2)",
        "Dupla Chance: Mandante ou Empate (1X)",
        "Dupla Chance: Visitante ou Empate (X2)",
        "Dupla Chance: Mandante ou Visitante (12)",
        "Empate Anula Aposta: Mandante",
        "Empate Anula Aposta: Visitante",
        "Intervalo/Final: Mandante / Mandante"
      ]
    };

    let bets = JSON.parse(localStorage.getItem('myBets')) || [];
    let initialBank = parseFloat(localStorage.getItem('initialBank')) || 0;
    let currentFilter = 'all';
    let currentCategory = '';
    let tempLegs = [];

    document.getElementById('betDate').valueAsDate = new Date();
    document.getElementById('initialBankInput').value = initialBank ? initialBank : '';

    // Função de Carregamento Dinâmico de Categorias do Arquivo JSON
    async function carregarMercadosJSON() {
      try {
        const resposta = await fetch('mercados.json');
        if (resposta.ok) {
          const dados = await resposta.json();
          if (dados && Object.keys(dados).length > 0) {
            marketCategories = dados;
          }
        }
      } catch (e) {
        console.warn("Lendo lista padrão de mercados (arquivo mercados.json não encontrado ou aberto localmente).");
      }
      renderCategoryTabs();
    }

    function getCategoryIcon(catName) {
      const name = catName.toLowerCase();
      if (name.includes('gol')) return '⚽';
      if (name.includes('escanteio')) return '🚩';
      if (name.includes('chute')) return '🎯';
      if (name.includes('cartã') || name.includes('cartao')) return '🟨';
      if (name.includes('resultado') || name.includes('vencedor')) return '🏆';
      if (name.includes('jogador')) return '👤';
      return '📌';
    }

    function renderCategoryTabs() {
      const container = document.getElementById('catTabsContainer');
      const keys = Object.keys(marketCategories);

      if (keys.length === 0) return;

      if (!currentCategory || !keys.includes(currentCategory)) {
        currentCategory = keys[0];
      }

      container.innerHTML = keys.map(cat => {
        const isActive = cat === currentCategory ? 'active' : '';
        const icon = getCategoryIcon(cat);
        // Escapa aspas para evitar erros de sintaxe
        const catEscaped = cat.replace(/'/g, "\\'");
        return `<button type="button" class="cat-tab ${isActive}" onclick="selectCategory('${catEscaped}')">${icon} ${cat}</button>`;
      }).join('');

      renderSubmarkets();
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategoryTabs();
    }

    function renderSubmarkets() {
      const container = document.getElementById('submarketContainer');
      const items = marketCategories[currentCategory] || [];
      
      if (items.length === 0) {
        container.innerHTML = '<div style="grid-column: span 2; font-size:0.8rem; color:var(--subtext); padding:10px;">Nenhuma opção nesta categoria.</div>';
        return;
      }

      container.innerHTML = items.map(item => {
        const itemEscaped = item.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return `
          <button type="button" class="submarket-btn" onclick="addLegFromPicker('${itemEscaped}')">
            ➕ ${item}
          </button>
        `;
      }).join('');
    }

    function addLegFromPicker(marketName) {
      tempLegs.push({ id: Date.now() + Math.random(), name: marketName, status: 'pending' });
      renderBuilder();
    }

    function addCustomLeg() {
      const input = document.getElementById('customMarketInput');
      const val = input.value.trim();
      if (val) {
        tempLegs.push({ id: Date.now() + Math.random(), name: val, status: 'pending' });
        input.value = '';
        renderBuilder();
      }
    }

    function removeLegFromForm(id) {
      tempLegs = tempLegs.filter(l => l.id !== id);
      renderBuilder();
    }

    function renderBuilder() {
      const container = document.getElementById('builderList');
      container.innerHTML = tempLegs.map(l => `
        <div class="builder-item">
          <span>📌 ${l.name}</span>
          <button type="button" style="background:none; border:none; color:var(--red); cursor:pointer; font-weight:bold;" onclick="removeLegFromForm(${l.id})">✖</button>
        </div>
      `).join('');
    }

    function updateInitialBank(val) {
      initialBank = parseFloat(val) || 0;
      localStorage.setItem('initialBank', initialBank);
      render();
    }

    document.getElementById('betForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const dateVal = document.getElementById('betDate').value;
      const home = document.getElementById('homeTeam').value.trim();
      const away = document.getElementById('awayTeam').value.trim();
      const match = (home && away) ? `${home} x ${away}` : (home || away);
      
      const stake = parseFloat(document.getElementById('stake').value);
      const odds = parseFloat(document.getElementById('odds').value);

      if (tempLegs.length === 0) {
        alert("Por favor, selecione ao menos uma opção ou mercado para o seu bilhete.");
        return;
      }

      bets.unshift({
        id: Date.now(),
        date: dateVal,
        match,
        stake,
        odds,
        status: 'pending',
        legs: tempLegs
      });

      tempLegs = [];
      renderBuilder();
      saveAndUpdate();
      e.target.reset();
      document.getElementById('betDate').valueAsDate = new Date();
    });

    function toggleLegStatus(betId, legId, newStatus) {
      const bet = bets.find(b => b.id === betId);
      if (bet) {
        const leg = bet.legs.find(l => l.id === legId);
        if (leg) {
          leg.status = (leg.status === newStatus) ? 'pending' : newStatus;
        }

        const hasRed = bet.legs.some(l => l.status === 'red');
        const allGreen = bet.legs.every(l => l.status === 'green');

        if (hasRed) {
          bet.status = 'red';
        } else if (allGreen && bet.legs.length > 0) {
          bet.status = 'green';
        } else {
          bet.status = 'pending';
        }

        saveAndUpdate();
      }
    }

    function deleteBet(id) {
      if (confirm("Deseja apagar este bilhete?")) {
        bets = bets.filter(b => b.id !== id);
        saveAndUpdate();
      }
    }

    function resetAll() {
      if (confirm("⚠️ ATENÇÃO: Zerar todas as apostas e dados?")) {
        bets = [];
        initialBank = 0;
        localStorage.removeItem('myBets');
        localStorage.removeItem('initialBank');
        document.getElementById('initialBankInput').value = '';
        render();
      }
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function saveAndUpdate() {
      localStorage.setItem('myBets', JSON.stringify(bets));
      render();
    }

    function formatDateFormatted(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return `${daysOfWeek[d.getDay()]}, ${parts[2]}/${parts[1]}`;
    }

    function render() {
      const list = document.getElementById('betsList');
      list.innerHTML = '';

      let totalStaked = 0;
      let totalReturned = 0;
      let greens = 0;
      let finishedCount = 0;

      bets.forEach(b => {
        let betReturn = 0;
        if (b.status === 'green') {
          betReturn = b.stake * b.odds;
          totalStaked += b.stake;
          totalReturned += betReturn;
          greens++;
          finishedCount++;
        } else if (b.status === 'red') {
          betReturn = 0;
          totalStaked += b.stake;
          finishedCount++;
        }

        if (currentFilter !== 'all' && b.status !== currentFilter) {
          return;
        }

        const potentialReturn = b.stake * b.odds;
        const potentialProfit = potentialReturn - b.stake;
        const netBetProfit = b.status === 'green' ? potentialProfit : (b.status === 'red' ? -b.stake : 0);

        const div = document.createElement('div');
        div.className = 'bet-card';

        const legsHtml = (b.legs || []).map(l => `
          <div class="leg-row ${l.status}">
            <span>${l.status === 'green' ? '✅' : l.status === 'red' ? '❌' : '⏳'} ${l.name}</span>
            <div class="leg-btns">
              <button class="btn-chip green" onclick="toggleLegStatus(${b.id}, ${l.id}, 'green')">GREEN</button>
              <button class="btn-chip red" onclick="toggleLegStatus(${b.id}, ${l.id}, 'red')">RED</button>
            </div>
          </div>
        `).join('');

        let badgeClass = 'pending';
        let badgeText = 'PENDENTE';
        if (b.status === 'green') { badgeClass = 'green'; badgeText = 'GREEN 🟢'; }
        if (b.status === 'red') { badgeClass = 'red'; badgeText = 'RED 🔴'; }

        div.innerHTML = `
          <div class="bet-head">
            <div>
              <div class="bet-date">📅 ${formatDateFormatted(b.date)}</div>
              <div class="bet-match">${b.match}</div>
            </div>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>

          <div class="fin-box">
            <div class="fin-item">
              <label>Apostado</label>
              <span>R$ ${b.stake.toFixed(2)}</span>
            </div>
            <div class="fin-item">
              <label>Odd</label>
              <span>@ ${b.odds.toFixed(2)}</span>
            </div>
            <div class="fin-item">
              <label>Retorno</label>
              <span style="color:var(--blue)">R$ ${potentialReturn.toFixed(2)}</span>
            </div>
            <div class="fin-item">
              <label>Lucro</label>
              <span style="color: ${b.status === 'green' ? 'var(--green)' : b.status === 'red' ? 'var(--red)' : 'var(--yellow)'}">
                ${b.status === 'pending' ? '+R$ ' + potentialProfit.toFixed(2) : (netBetProfit >= 0 ? '+R$ ' + netBetProfit.toFixed(2) : '-R$ ' + Math.abs(netBetProfit).toFixed(2))}
              </span>
            </div>
          </div>

          <div class="legs-container">
            ${legsHtml}
          </div>

          <div class="bet-foot">
            <span style="font-size:0.75rem; color:var(--subtext);">${(b.legs || []).length} seleção(ões)</span>
            <button class="btn-del" onclick="deleteBet(${b.id})">🗑️ Apagar Bilhete</button>
          </div>
        `;

        list.appendChild(div);
      });

      const netProfit = totalReturned - totalStaked;
      const currentBank = initialBank + netProfit;
      const bankGrowth = initialBank > 0 ? ((netProfit / initialBank) * 100) : 0;
      const yieldRate = totalStaked > 0 ? ((netProfit / totalStaked) * 100) : 0;

      document.getElementById('currentBank').textContent = `R$ ${currentBank.toFixed(2)}`;
      document.getElementById('bankGrowth').textContent = `${bankGrowth >= 0 ? '+' : ''}${bankGrowth.toFixed(1)}% de crescimento`;
      document.getElementById('bankGrowth').style.color = bankGrowth >= 0 ? 'var(--green)' : 'var(--red)';

      document.getElementById('netProfit').textContent = `${netProfit >= 0 ? '+' : ''}R$ ${netProfit.toFixed(2)}`;
      document.getElementById('netProfit').style.color = netProfit >= 0 ? 'var(--green)' : 'var(--red)';
      
      document.getElementById('yieldRate').textContent = `Yield: ${yieldRate.toFixed(1)}%`;
      document.getElementById('cashFlow').textContent = `R$ ${totalStaked.toFixed(2)} / R$ ${totalReturned.toFixed(2)}`;
      
      document.getElementById('winRate').textContent = finishedCount ? `${((greens / finishedCount) * 100).toFixed(1)}%` : '0%';
      document.getElementById('finishedBetsCount').textContent = `${finishedCount} de ${bets.length} bilhetes fechados`;
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ bets, initialBank }));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", `banca_pro_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchorElem.click();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file, 'UTF-8');
        reader.onload = readerEvent => {
          try {
            const content = JSON.parse(readerEvent.target.result);
            if (content.bets) {
              bets = content.bets;
              initialBank = content.initialBank || 0;
              document.getElementById('initialBankInput').value = initialBank;
              saveAndUpdate();
            }
          } catch (err) {
            alert("Erro ao ler arquivo de backup.");
          }
        }
      }
      input.click();
    }

    // Inicialização ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
      carregarMercadosJSON();
      render();
    });
  </script>
</body>
</html>
