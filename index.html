<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betano Pro Manager - Gestor de Banca</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151922;
      --card-inner: #1c2230;
      --border: #2a3142;
      --text: #f0f4fc;
      --subtext: #8c9ba5;
      --accent: #ff6b00; /* Laranja Betano */
      --green: #00e676;
      --green-bg: rgba(0, 230, 118, 0.12);
      --red: #ff5252;
      --red-bg: rgba(255, 82, 82, 0.12);
      --yellow: #ffd600;
      --yellow-bg: rgba(255, 214, 0, 0.12);
      --blue: #29b6f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px 0 18px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
    }

    header h1 span { color: var(--accent); }

    /* Dashboard Metrics */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--border);
    }

    .metric-card.accent::before { background: var(--accent); }
    .metric-card.green::before { background: var(--green); }
    .metric-card.blue::before { background: var(--blue); }

    .metric-card h4 {
      font-size: 0.7rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .metric-card .val {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .metric-card .sub-val {
      font-size: 0.75rem;
      margin-top: 2px;
      font-weight: 600;
    }

    /* Bank Settings Box */
    .bank-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bank-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bank-row label {
      font-size: 0.85rem;
      color: var(--subtext);
      white-space: nowrap;
    }

    .backup-row {
      display: flex;
      gap: 8px;
    }

    /* Forms & Inputs */
    form {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .match-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .match-vs {
      font-weight: 800;
      color: var(--accent);
      font-size: 0.9rem;
    }

    input, select, button {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    /* Market Shortcuts */
    .market-tags {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tag-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      white-space: nowrap;
      cursor: pointer;
      width: auto;
    }

    .tag-btn:hover {
      border-color: var(--accent);
      color: #fff;
    }

    .add-selection-box {
      background: var(--card-inner);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .builder-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .builder-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Dynamic Return Calculation Preview */
    .calc-preview {
      background: rgba(255, 107, 0, 0.08);
      border: 1px solid rgba(255, 107, 0, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .calc-preview span { color: var(--subtext); }
    .calc-preview strong { color: var(--green); font-size: 0.95rem; }

    .btn-main {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(255, 107, 0, 0.25);
    }

    .btn-sec {
      background: var(--card-inner);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 8px 10px;
      border-radius: 6px;
    }

    /* Bet List Item */
    .bet-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bet-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .bet-date { font-size: 0.72rem; color: var(--subtext); font-weight: 600; text-transform: uppercase; }
    .bet-match { font-size: 1.05rem; font-weight: 800; color: #fff; margin-top: 2px; }

    .fin-box {
      display: flex;
      gap: 12px;
      background: var(--card-inner);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      align-items: center;
    }

    .fin-item {
      display: flex;
      flex-direction: column;
      font-size: 0.75rem;
    }

    .fin-item label { color: var(--subtext); font-size: 0.68rem; text-transform: uppercase; }
    .fin-item span { font-weight: 700; }

    .legs-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .leg-row {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-left: 4px solid var(--subtext);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .leg-row.green { border-left-color: var(--green); }
    .leg-row.red { border-left-color: var(--red); }
    .leg-row.pending { border-left-color: var(--yellow); }

    .leg-btns { display: flex; gap: 4px; }
    .btn-chip {
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .btn-chip.green { background: var(--green); color: #000; }
    .btn-chip.red { background: var(--red); color: #fff; }

    .bet-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .badge.pending { background: var(--yellow-bg); color: var(--yellow); }
    .badge.green { background: var(--green-bg); color: var(--green); }
    .badge.red { background: var(--red-bg); color: var(--red); }

    .btn-del {
      background: transparent;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-del:hover { color: var(--red); }

    /* Filters */
    .filters-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <h1>BETANO <span>PRO MANAGER</span></h1>
  </header>

  <!-- Painel de Finanças e Lucro -->
  <div class="metrics-grid">
    <div class="metric-card accent">
      <h4>Banca Atual</h4>
      <div class="val" id="currentBank">R$ 0,00</div>
      <div class="sub-val" id="bankGrowth" style="color: var(--subtext);">0.0% do Inicial</div>
    </div>
    <div class="metric-card green">
      <h4>Lucro Líquido</h4>
      <div class="val" id="netProfit">R$ 0,00</div>
      <div class="sub-val" id="yieldRate" style="color: var(--green);">Yield: 0%</div>
    </div>
    <div class="metric-card blue">
      <h4>Entradas vs Saídas</h4>
      <div class="val" id="cashFlow" style="font-size: 0.95rem;">R$ 0 / R$ 0</div>
      <div class="sub-val" style="color: var(--subtext);">Apostado / Retornado</div>
    </div>
    <div class="metric-card">
      <h4>Taxa de Acerto</h4>
      <div class="val" id="winRate">0%</div>
      <div class="sub-val" id="finishedBetsCount" style="color: var(--subtext);">0 Bilhetes Resolvidos</div>
    </div>
  </div>

  <!-- Configuração de Banca e Backup -->
  <div class="bank-box">
    <div class="bank-row">
      <label for="initialBankInput">Banca Inicial (R$):</label>
      <input type="number" id="initialBankInput" step="0.01" placeholder="Ex: 100,00" onchange="updateInitialBank(this.value)">
    </div>
    <div class="backup-row">
      <button class="btn-sec" onclick="exportData()">💾 Backup JSON</button>
      <button class="btn-sec" onclick="importData()">📂 Restaurar</button>
      <button class="btn-sec" style="color: var(--red);" onclick="resetAll()">⚠️ Resetar</button>
    </div>
  </div>

  <!-- Form de Cadastro de Bilhete -->
  <form id="betForm">
    <div class="form-title">📌 Novo Bilhete de Aposta</div>

    <input type="date" id="betDate" required>

    <div class="match-inputs">
      <input type="text" id="homeTeam" list="teamsList" placeholder="Mandante (Ex: Al-Hilal)" required autocomplete="off">
      <span class="match-vs">X</span>
      <input type="text" id="awayTeam" list="teamsList" placeholder="Visitante (Ex: Al-Ahly)" required autocomplete="off">
    </div>

    <datalist id="teamsList">
      <option value="Al-Hilal"><option value="Al-Ahly"><option value="Al-Nassr"><option value="Al-Ittihad">
      <option value="Flamengo"><option value="Palmeiras"><option value="São Paulo"><option value="Corinthians">
      <option value="Real Madrid"><option value="Barcelona"><option value="Manchester City"><option value="Borussia Dortmund">
    </datalist>

    <!-- Adicionar Seleções -->
    <div class="add-selection-box">
      <span style="font-size: 0.8rem; color: var(--subtext); font-weight: 600;">Adicionar Mercados ao Bilhete:</span>
      
      <!-- Atalhos de Categorias -->
      <div class="market-tags">
        <button type="button" class="tag-btn" onclick="quickMarket('Escanteios: Mais de 3.5 do Mandante')">🚩 Escanteios Mandante</button>
        <button type="button" class="tag-btn" onclick="quickMarket('Escanteios: Mais de 8.5 na Partida')">🚩 Escanteios Jogo</button>
        <button type="button" class="tag-btn" onclick="quickMarket('Chutes no Gol: +0.5 (Jogador)')">🎯 Chute no Gol</button>
        <button type="button" class="tag-btn" onclick="quickMarket('Gols: Mais de 1.5 na Partida')">⚽ Gols (+1.5)</button>
        <button type="button" class="tag-btn" onclick="quickMarket('Gols: Ambas Marcam (Sim)')">⚽ Ambas Marcam</button>
      </div>

      <input type="text" id="marketInput" list="marketsList" placeholder="Escolha ou Digite a Seleção Livremente" autocomplete="off">
      <datalist id="marketsList">
        <option value="Escanteios: Mais de 3.5 do Mandante">
        <option value="Escanteios: Mais de 4.5 do Mandante">
        <option value="Escanteios: Mais de 8.5 na Partida">
        <option value="Escanteios: Mais de 10.5 na Partida">
        <option value="Chutes no Gol: +0.5 Chutes no Gol (Jogador)">
        <option value="Chutes no Gol: +1.5 Chutes no Gol (Jogador)">
        <option value="Gols: Mais de 1.5 na Partida">
        <option value="Gols: Mais de 2.5 na Partida">
        <option value="Gols: Ambas as Equipes Marcam (Sim)">
        <option value="Cartões: Mais de 3.5 Cartões Amarelos">
      </datalist>

      <button type="button" class="btn-sec" onclick="addLegToForm()">➕ Inserir Seleção no Bilhete</button>
      <div id="builderList" class="builder-list"></div>
    </div>

    <!-- Financeiro da Aposta -->
    <div style="display: flex; gap: 10px;">
      <input type="number" step="0.01" id="stake" placeholder="Stake (R$)" required oninput="calcPreview()">
      <input type="number" step="0.01" id="odds" placeholder="Odd Total (Ex: 2.10)" required oninput="calcPreview()">
    </div>

    <!-- Preview do Lucro Potencial -->
    <div class="calc-preview" id="calcPreviewBox">
      <span>Retorno Estimado: <strong>R$ 0,00</strong></span>
      <span>Lucro Previsto: <strong id="previewProfit">R$ 0,00</strong></span>
    </div>

    <button type="submit" class="btn-main">Cadastrar Bilhete de Aposta</button>
  </form>

  <!-- Filtros -->
  <div class="filters-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">Todas</button>
    <button class="filter-btn" onclick="setFilter('pending', this)">Pendentes</button>
    <button class="filter-btn" onclick="setFilter('green', this)">Greens 🟢</button>
    <button class="filter-btn" onclick="setFilter('red', this)">Reds 🔴</button>
  </div>

  <!-- Lista de Apostas -->
  <div id="betsList"></div>

  <script>
    const daysOfWeek = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

    let bets = JSON.parse(localStorage.getItem('myBets')) || [];
    let initialBank = parseFloat(localStorage.getItem('initialBank')) || 0;
    let currentFilter = 'all';
    let tempLegs = [];

    document.getElementById('betDate').valueAsDate = new Date();
    document.getElementById('initialBankInput').value = initialBank ? initialBank : '';

    function updateInitialBank(val) {
      initialBank = parseFloat(val) || 0;
      localStorage.setItem('initialBank', initialBank);
      render();
    }

    function quickMarket(text) {
      document.getElementById('marketInput').value = text;
    }

    function addLegToForm() {
      const input = document.getElementById('marketInput');
      const val = input.value.trim();
      if (val) {
        tempLegs.push({ id: Date.now() + Math.random(), name: val, status: 'pending' });
        input.value = '';
        renderBuilder();
      }
    }

    function removeLegFromForm(id) {
      tempLegs = tempLegs.filter(l => l.id !== id);
      renderBuilder();
    }

    function renderBuilder() {
      const container = document.getElementById('builderList');
      container.innerHTML = tempLegs.map(l => `
        <div class="builder-item">
          <span>📌 ${l.name}</span>
          <button type="button" style="background:none; border:none; color:var(--red); cursor:pointer; font-weight:bold;" onclick="removeLegFromForm(${l.id})">✖</button>
        </div>
      `).join('');
    }

    function calcPreview() {
      const stake = parseFloat(document.getElementById('stake').value) || 0;
      const odds = parseFloat(document.getElementById('odds').value) || 0;

      const totalReturn = stake * odds;
      const profit = totalReturn - stake;

      const box = document.getElementById('calcPreviewBox');
      if (stake > 0 && odds > 0) {
        box.innerHTML = `
          <span>Retorno: <strong>R$ ${totalReturn.toFixed(2)}</strong></span>
          <span>Lucro Previsto: <strong style="color:var(--green)">+R$ ${profit.toFixed(2)}</strong></span>
        `;
      } else {
        box.innerHTML = `
          <span>Retorno Estimado: <strong>R$ 0,00</strong></span>
          <span>Lucro Previsto: <strong>R$ 0,00</strong></span>
        `;
      }
    }

    document.getElementById('betForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const dateVal = document.getElementById('betDate').value;
      const home = document.getElementById('homeTeam').value.trim();
      const away = document.getElementById('awayTeam').value.trim();
      const match = (home && away) ? `${home} x ${away}` : (home || away);
      
      const stake = parseFloat(document.getElementById('stake').value);
      const odds = parseFloat(document.getElementById('odds').value);

      if (tempLegs.length === 0) {
        const mVal = document.getElementById('marketInput').value.trim() || 'Aposta Simples';
        tempLegs.push({ id: Date.now(), name: mVal, status: 'pending' });
      }

      bets.unshift({
        id: Date.now(),
        date: dateVal,
        match,
        stake,
        odds,
        status: 'pending',
        legs: tempLegs
      });

      tempLegs = [];
      renderBuilder();
      saveAndUpdate();
      e.target.reset();
      document.getElementById('betDate').valueAsDate = new Date();
      calcPreview();
    });

    function toggleLegStatus(betId, legId, newStatus) {
      const bet = bets.find(b => b.id === betId);
      if (bet) {
        const leg = bet.legs.find(l => l.id === legId);
        if (leg) {
          leg.status = (leg.status === newStatus) ? 'pending' : newStatus;
        }

        const hasRed = bet.legs.some(l => l.status === 'red');
        const allGreen = bet.legs.every(l => l.status === 'green');

        if (hasRed) {
          bet.status = 'red';
        } else if (allGreen && bet.legs.length > 0) {
          bet.status = 'green';
        } else {
          bet.status = 'pending';
        }

        saveAndUpdate();
      }
    }

    function deleteBet(id) {
      if (confirm("Deseja apagar este bilhete?")) {
        bets = bets.filter(b => b.id !== id);
        saveAndUpdate();
      }
    }

    function resetAll() {
      if (confirm("⚠️ ATENÇÃO: Zerar todas as apostas e dados?")) {
        bets = [];
        initialBank = 0;
        localStorage.removeItem('myBets');
        localStorage.removeItem('initialBank');
        document.getElementById('initialBankInput').value = '';
        render();
      }
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function saveAndUpdate() {
      localStorage.setItem('myBets', JSON.stringify(bets));
      render();
    }

    function formatDateFormatted(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return `${daysOfWeek[d.getDay()]}, ${parts[2]}/${parts[1]}`;
    }

    function render() {
      const list = document.getElementById('betsList');
      list.innerHTML = '';

      let totalStaked = 0;
      let totalReturned = 0;
      let greens = 0;
      let finishedCount = 0;

      bets.forEach(b => {
        let betReturn = 0;
        if (b.status === 'green') {
          betReturn = b.stake * b.odds;
          totalStaked += b.stake;
          totalReturned += betReturn;
          greens++;
          finishedCount++;
        } else if (b.status === 'red') {
          betReturn = 0;
          totalStaked += b.stake;
          finishedCount++;
        }

        if (currentFilter !== 'all' && b.status !== currentFilter) {
          return;
        }

        const netBetProfit = b.status === 'green' ? (betReturn - b.stake) : (b.status === 'red' ? -b.stake : 0);

        const div = document.createElement('div');
        div.className = 'bet-card';

        const legsHtml = (b.legs || []).map(l => `
          <div class="leg-row ${l.status}">
            <span>${l.status === 'green' ? '✅' : l.status === 'red' ? '❌' : '⏳'} ${l.name}</span>
            <div class="leg-btns">
              <button class="btn-chip green" onclick="toggleLegStatus(${b.id}, ${l.id}, 'green')">GREEN</button>
              <button class="btn-chip red" onclick="toggleLegStatus(${b.id}, ${l.id}, 'red')">RED</button>
            </div>
          </div>
        `).join('');

        let badgeClass = 'pending';
        let badgeText = 'PENDENTE';
        if (b.status === 'green') { badgeClass = 'green'; badgeText = 'GREEN 🟢'; }
        if (b.status === 'red') { badgeClass = 'red'; badgeText = 'RED 🔴'; }

        div.innerHTML = `
          <div class="bet-head">
            <div>
              <div class="bet-date">📅 ${formatDateFormatted(b.date)}</div>
              <div class="bet-match">${b.match}</div>
            </div>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>

          <div class="fin-box">
            <div class="fin-item">
              <label>Apostado</label>
              <span>R$ ${b.stake.toFixed(2)}</span>
            </div>
            <div class="fin-item">
              <label>Odd</label>
              <span>@ ${b.odds.toFixed(2)}</span>
            </div>
            <div class="fin-item">
              <label>Retorno Potencial</label>
              <span style="color:var(--blue)">R$ ${(b.stake * b.odds).toFixed(2)}</span>
            </div>
            <div class="fin-item" style="margin-left:auto; text-align:right;">
              <label>Resultado</label>
              <span style="color: ${netBetProfit > 0 ? 'var(--green)' : netBetProfit < 0 ? 'var(--red)' : 'var(--subtext)'}">
                ${netBetProfit > 0 ? '+' : ''}${b.status !== 'pending' ? 'R$ ' + netBetProfit.toFixed(2) : '--'}
              </span>
            </div>
          </div>

          <div class="legs-container">
            ${legsHtml}
          </div>

          <div class="bet-foot">
            <span style="font-size:0.75rem; color:var(--subtext);">${(b.legs || []).length} seleção(ões)</span>
            <button class="btn-del" onclick="deleteBet(${b.id})">🗑️ Apagar Bilhete</button>
          </div>
        `;

        list.appendChild(div);
      });

      const netProfit = totalReturned - totalStaked;
      const currentBank = initialBank + netProfit;
      const bankGrowth = initialBank > 0 ? ((netProfit / initialBank) * 100) : 0;
      const yieldRate = totalStaked > 0 ? ((netProfit / totalStaked) * 100) : 0;

      document.getElementById('currentBank').textContent = `R$ ${currentBank.toFixed(2)}`;
      document.getElementById('bankGrowth').textContent = `${bankGrowth >= 0 ? '+' : ''}${bankGrowth.toFixed(1)}% de crescimento`;
      document.getElementById('bankGrowth').style.color = bankGrowth >= 0 ? 'var(--green)' : 'var(--red)';

      document.getElementById('netProfit').textContent = `${netProfit >= 0 ? '+' : ''}R$ ${netProfit.toFixed(2)}`;
      document.getElementById('netProfit').style.color = netProfit >= 0 ? 'var(--green)' : 'var(--red)';
      
      document.getElementById('yieldRate').textContent = `Yield: ${yieldRate.toFixed(1)}%`;
      document.getElementById('cashFlow').textContent = `R$ ${totalStaked.toFixed(2)} / R$ ${totalReturned.toFixed(2)}`;
      
      document.getElementById('winRate').textContent = finishedCount ? `${((greens / finishedCount) * 100).toFixed(1)}%` : '0%';
      document.getElementById('finishedBetsCount').textContent = `${finishedCount} de ${bets.length} bilhetes fechados`;
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ bets, initialBank }));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", `banca_pro_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchorElem.click();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file, 'UTF-8');
        reader.onload = readerEvent => {
          try {
            const content = JSON.parse(readerEvent.target.result);
            if (content.bets) {
              bets = content.bets;
              initialBank = content.initialBank || 0;
              document.getElementById('initialBankInput').value = initialBank;
              saveAndUpdate();
            }
          } catch (err) {
            alert("Erro ao ler backup.");
          }
        }
      }
      input.click();
    }

    render();
  </script>
</body>
</html>
